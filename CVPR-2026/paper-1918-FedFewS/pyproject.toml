[project]
name = "code"
version = "0.1.0"
description = "Few-for-Many Personalized Federated Learning Implementation"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    # Core dependencies
    "numpy>=1.24,<2", # PFLlib requires numpy<2
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    # PyTorch ecosystem (upgraded for RTX 5090 support)
    # RTX 5090 requires PyTorch with CUDA 12.8+ for sm_120 (Blackwell architecture) support
    # Using latest PyTorch from cu128 index for full GPU compatibility
    "torch",
    "torchvision",
    # Machine Learning
    "scikit-learn>=1.2.0",
    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    # Data handling
    "h5py>=3.7.0",
    "ujson>=5.7.0",
    "pyyaml>=6.0",
    # PFLlib specific dependencies
    "click>=8.1.0",
    "calmsize>=0.1.3",
    "memory-profiler>=0.60.0",
    "portalocker>=2.7.0",
    "cvxpy>=1.3.0",
    "higher>=0.2.1",
    # Optional: Hugging Face ecosystem (for advanced models)
    "diffusers>=0.16.0",
    "accelerate>=0.20.0",
    "transformers>=4.30.0",
    "snakeviz>=2.2.2",
    "gdown>=5.2.0",
    "wilds>=2.0.0",
    "kagglehub>=0.3.13",
    "datasets>=2.14.0",

]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128/"
explicit = true
