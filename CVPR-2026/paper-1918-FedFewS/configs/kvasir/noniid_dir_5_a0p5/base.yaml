# Base Configuration for Kvasir experiments
# Dirichlet(α=0.5), 5 clients
#
# 公共配置 - 一改全改！
# 所有算法共享的训练参数都在这里定义
#
# 使用方法：
#   uv run scripts/run_pfllib.py configs/kvasir/noniid_dir_5_a0p5/algorithms/<algorithm>.yaml

dataset:
  name: kvasir
  config: noniid_dir_5_a0p5
  num_classes: 8
  num_clients: 5
model:
  name: ResNet18
training:
  global_rounds: 1000
  local_epochs: 1
  batch_size: 100
  learning_rate: 0.002
  join_ratio: 1.0
  eval_gap: 10
device:
  type: cuda
  id: "0"
experiment:
  goal: baseline
  times: 1
