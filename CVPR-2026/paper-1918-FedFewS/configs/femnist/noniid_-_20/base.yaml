# Base Configuration for FEMNIST experiments
# noniid_-_20, 20 clients
#
# 公共配置 - 一改全改！
# 所有算法共享的训练参数都在这里定义
#
# 使用方法：
#   uv run scripts/run_pfllib.py configs/femnist/noniid_-_20/algorithms/<algorithm>.yaml

dataset:
  name: femnist
  config: noniid_-_20
  num_classes: 62
  num_clients: 20
model:
  name: CNN
training:
  global_rounds: 2000
  local_epochs: 1
  batch_size: 100
  learning_rate: 0.005
  join_ratio: 1.0
  eval_gap: 10
device:
  type: cuda
  id: "0"
experiment:
  goal: baseline
  times: 1
