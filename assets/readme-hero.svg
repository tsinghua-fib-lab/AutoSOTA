<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AutoSOTA</title>
  <desc id="description">Automated optimization of research codebases. Research, optimize, evaluate. A mint and gold research loop surrounds the AutoSOTA mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1720"/>
      <stop offset="1" stop-color="#111e25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop stop-color="#9cffb3"/>
      <stop offset="1" stop-color="#ffdb94"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="280" y1="110" x2="570" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9cffb3"/>
      <stop offset="1" stop-color="#ffdb94"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#9cffb3" stop-opacity=".11"/>
      <stop offset="1" stop-color="#9cffb3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b5d0c2" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="945" cy="178" rx="330" ry="290" fill="url(#glow)"/>
    <path d="M0 359H1200" stroke="#9cffb3" stroke-opacity=".3" stroke-width="2"/>
    <path d="M682 0 762 80V280L682 360" fill="none" stroke="#bfd9cb" stroke-opacity=".09"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="52" y="44" width="251" height="30" rx="15" fill="#9cffb3" fill-opacity=".07" stroke="#9cffb3" stroke-opacity=".2"/>
      <circle cx="70" cy="59" r="3" fill="#9cffb3"/>
      <text x="83" y="63" fill="#bde6c8" font-size="11" font-weight="600" letter-spacing="2">AUTOMATED AI RESEARCH</text>

      <text x="48" y="175" fill="#f1f6f2" font-size="94" font-weight="750" letter-spacing="-4">Auto<tspan fill="url(#wordmark)">SOTA</tspan></text>
      <text x="53" y="216" fill="#b2c2bd" font-size="22">Automated optimization of research codebases.</text>

      <g font-size="11" font-weight="600" letter-spacing="1.6" text-anchor="middle">
        <rect x="53" y="271" width="130" height="34" rx="7" fill="#9cffb3" fill-opacity=".05" stroke="#9cffb3" stroke-opacity=".19"/>
        <text x="118" y="292" fill="#c7e7cf">RESEARCH</text>
        <path d="M197 288H214m-5-5 5 5-5 5" fill="none" stroke="#61776b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="228" y="271" width="130" height="34" rx="7" fill="#c6e5b0" fill-opacity=".05" stroke="#c6e5b0" stroke-opacity=".19"/>
        <text x="293" y="292" fill="#d6e5c6">OPTIMIZE</text>
        <path d="M372 288H389m-5-5 5 5-5 5" fill="none" stroke="#7d7a60" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="403" y="271" width="130" height="34" rx="7" fill="#ffdb94" fill-opacity=".05" stroke="#ffdb94" stroke-opacity=".19"/>
        <text x="468" y="292" fill="#ecddbb">EVALUATE</text>
      </g>

      <g transform="translate(950 176)">
        <circle r="130" fill="none" stroke="#a6c4b2" stroke-opacity=".15"/>
        <circle r="96" fill="none" stroke="#a6c4b2" stroke-opacity=".13" stroke-dasharray="3 8"/>
        <ellipse rx="157" ry="65" transform="rotate(-35)" fill="none" stroke="url(#accent)" stroke-opacity=".4"/>
        <path d="M-104-78A130 130 0 0 1 106-75M124 40A130 130 0 0 1-10 130M-78 104A130 130 0 0 1-130-7" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
        <g fill="#111f25" stroke="#8aaa94" stroke-opacity=".4">
          <rect x="-132" y="-104" width="80" height="26" rx="13"/>
          <rect x="80" y="-1" width="80" height="26" rx="13"/>
          <rect x="-83" y="96" width="95" height="26" rx="13"/>
        </g>
        <g fill="#d0ddd5" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">
          <text x="-92" y="-87">CODE</text>
          <text x="120" y="16">SEARCH</text>
          <text x="-35.5" y="113">RESULTS</text>
        </g>
        <circle cx="66" cy="-112" r="4" fill="#ffdb94"/>
        <circle cx="-112" cy="44" r="4" fill="#9cffb3"/>
        <circle cx="66" cy="108" r="3" fill="#d5e7ad"/>
        <rect x="-52" y="-52" width="104" height="104" rx="23" fill="#14252a" stroke="#9cffb3" stroke-opacity=".25"/>
        <g transform="translate(-48 -48) scale(1.5)">
          <path d="M17 49 30 15h8l13 34h-8l-2.8-7.6H27.8L25 49h-8Zm12.8-14.5h10.4L35 20.2l-5.2 14.3Z" fill="url(#accent)"/>
          <path d="M18 43c9.5-1.2 17.1-5.2 22.8-12.1" fill="none" stroke="#9cffb3" stroke-width="3" stroke-linecap="round"/>
          <path d="M39 20h12v12M50.5 20.5 39 32" fill="none" stroke="#ffdb94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text x="950" y="336" text-anchor="middle" fill="#829d8e" font-size="9" letter-spacing="3">THE RESEARCH LOOP</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="359" rx="21.5" fill="none" stroke="#557261" stroke-opacity=".3"/>
  </g>
</svg>
