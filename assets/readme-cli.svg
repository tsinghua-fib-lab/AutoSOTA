<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title description">
  <title id="title">AutoSOTA CLI</title>
  <desc id="description">Your research loop, in your terminal. A stylized terminal shows the init, doctor and optimization commands, with a research, edit, run and evaluate workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101c25"/>
      <stop offset="1" stop-color="#0c171f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#9cffb3"/>
      <stop offset="1" stop-color="#ffdb94"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#96cfff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#96cfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6c8ba" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="310" rx="22"/></clipPath>
    <clipPath id="terminal"><rect x="646" y="35" width="502" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="310" fill="url(#background)"/>
    <rect width="1200" height="310" fill="url(#grid)"/>
    <ellipse cx="916" cy="153" rx="360" ry="250" fill="url(#glow)"/>
    <path d="M588 0 618 62V248L588 310" fill="none" stroke="#a8c3b5" stroke-opacity=".1"/>
    <path d="M0 309H1200" stroke="#9cffb3" stroke-opacity=".3" stroke-width="2"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="52" y="40" width="235" height="28" rx="14" fill="#96cfff" fill-opacity=".06" stroke="#96cfff" stroke-opacity=".2"/>
      <path d="m68 49 5 5-5 5m10 0h6" fill="none" stroke="#a7d7fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="97" y="58" fill="#b7d8ed" font-size="10" font-weight="600" letter-spacing="1.8">COMMAND-LINE WORKFLOW</text>

      <text x="49" y="139" fill="#f1f6f2" font-size="61" font-weight="750" letter-spacing="-2">AutoSOTA <tspan fill="url(#accent)">CLI</tspan></text>
      <text x="53" y="181" fill="#b9c9c4" font-size="23">Your research loop. In your terminal.</text>

      <g font-size="10" font-weight="600" letter-spacing="1.5" text-anchor="middle">
        <rect x="53" y="230" width="143" height="32" rx="7" fill="#9cffb3" fill-opacity=".05" stroke="#9cffb3" stroke-opacity=".18"/>
        <text x="124.5" y="250" fill="#c7e7cf">RESUMABLE RUNS</text>
        <rect x="211" y="230" width="166" height="32" rx="7" fill="#ffdb94" fill-opacity=".05" stroke="#ffdb94" stroke-opacity=".18"/>
        <text x="294" y="250" fill="#ecddbb">MULTI-METRIC GOALS</text>
      </g>
    </g>

    <rect x="642" y="40" width="514" height="241" rx="16" fill="#01070b" fill-opacity=".3"/>
    <g clip-path="url(#terminal)">
      <rect x="646" y="35" width="502" height="240" fill="#0b141c"/>
      <rect x="646" y="35" width="502" height="37" fill="#17252e"/>
      <path d="M646 72H1148" stroke="#37505c" stroke-opacity=".45"/>
      <circle cx="666" cy="54" r="4" fill="#cf7f76"/>
      <circle cx="682" cy="54" r="4" fill="#d5b779"/>
      <circle cx="698" cy="54" r="4" fill="#8bc89e"/>
      <text x="901" y="58" text-anchor="middle" fill="#a6b8c1" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10">autosota / research workspace</text>

      <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" xml:space="preserve">
        <text x="668" y="113" fill="#dce8e4"><tspan fill="#9cffb3">$ </tspan>autosota <tspan fill="#a7d7fa">init</tspan></text>
        <text x="668" y="147" fill="#dce8e4"><tspan fill="#9cffb3">$ </tspan>autosota <tspan fill="#a7d7fa">doctor</tspan></text>
        <text x="668" y="181" fill="#dce8e4"><tspan fill="#9cffb3">$ </tspan>autosota <tspan fill="#a7d7fa">--repo</tspan> ./research-code <tspan fill="#a7d7fa">--devices</tspan> <tspan fill="#ffdb94">0</tspan></text>
      </g>
      <path d="M668 205H1126" stroke="#a8c3b5" stroke-opacity=".14"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" text-anchor="middle">
        <text x="708" y="239" fill="#c7e7cf">RESEARCH</text>
        <text x="832" y="239" fill="#cde4d9">EDIT</text>
        <text x="942" y="239" fill="#cddbea">RUN</text>
        <text x="1068" y="239" fill="#ecddbb">EVALUATE</text>
      </g>
      <g fill="none" stroke="#628078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M766 235H785m-4-4 4 4-4 4"/>
        <path d="M877 235H896m-4-4 4 4-4 4"/>
        <path d="M990 235H1009m-4-4 4 4-4 4"/>
      </g>
    </g>
    <rect x="646.5" y="35.5" width="501" height="239" rx="13.5" fill="none" stroke="#96cfff" stroke-opacity=".28"/>
    <rect x=".5" y=".5" width="1199" height="309" rx="21.5" fill="none" stroke="#557261" stroke-opacity=".3"/>
  </g>
</svg>
