# RNATransformer (pair-feature attention bias + dynamic position bias + conv), no pseudo labels.
name: t1_tfm
model: tfm
seed: 42
n_folds: 5
heads: [tfm]

structure: eternafold
test_loop: bprna

mask: {err_max: 10.0, snr_min: 1.5}
cluster_threshold: 10
cluster_weight: true
snr_weight: false
col_weights: [0.3, 0.3, 0.3, 0.05, 0.05]
perturb: 0.5
reverse_aug: true

tfm:
  model: {d: 192, heads: 6, layers: 8, pair_dim: 32, kernel: 7, dropout: 0.1}
  lr: 0.0005
  weight_decay: 0.05
  batch_size: 32
  epochs: 60

random_sets:
  - {name: rand130, n: 6000, length: 130, seed: 0}
