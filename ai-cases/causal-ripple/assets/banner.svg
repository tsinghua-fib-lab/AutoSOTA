<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title description">
  <title id="title">Causal-Ripple</title>
  <desc id="description">Paired counterfactual revision: verify a seed, probe its influence, and revise affected tokens jointly.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101528"/><stop offset="1" stop-color="#24213f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7ae0d3"/><stop offset="1" stop-color="#b8a4ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L7 4L0 8" fill="none" stroke="#9ba7c2" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="380" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#b8a4ff" opacity=".11">
    <circle cx="1158" cy="58" r="112"/><circle cx="1158" cy="58" r="161"/>
    <circle cx="1158" cy="58" r="210"/><circle cx="1158" cy="58" r="259"/>
  </g>
  <rect x="56" y="49" width="5" height="96" rx="2.5" fill="url(#accent)"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="80" y="85" font-size="15" font-weight="700" letter-spacing="3" fill="#7ae0d3">DIFFUSION CODE GENERATION</text>
    <text x="77" y="140" font-size="51" font-weight="700" letter-spacing="-1" fill="#f4f5ff">Causal-Ripple</text>
    <text x="80" y="177" font-size="20" fill="#b9c3d9">Paired counterfactual revision for diffusion language models</text>
    <g font-size="13" fill="#c8d2e7">
      <rect x="80" y="199" width="146" height="28" rx="14" fill="#ffffff" fill-opacity=".06"/>
      <text x="153" y="218" text-anchor="middle">Frozen backbone</text>
      <rect x="236" y="199" width="161" height="28" rx="14" fill="#ffffff" fill-opacity=".06"/>
      <text x="316" y="218" text-anchor="middle">Joint token revision</text>
      <rect x="407" y="199" width="144" height="28" rx="14" fill="#ffffff" fill-opacity=".06"/>
      <text x="479" y="218" text-anchor="middle">Five benchmarks</text>
    </g>
    <g>
      <rect x="80" y="267" width="328" height="71" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#61718e" stroke-opacity=".55"/>
      <rect x="476" y="267" width="328" height="71" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#61718e" stroke-opacity=".55"/>
      <rect x="872" y="267" width="328" height="71" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#61718e" stroke-opacity=".55"/>
      <text x="100" y="293" font-size="11" letter-spacing="2" fill="#7ae0d3">01 / VERIFY</text>
      <text x="100" y="319" font-size="17" font-weight="700" fill="#f4f5ff">Find an actionable seed</text>
      <text x="496" y="293" font-size="11" letter-spacing="2" fill="#b8a4ff">02 / PROBE</text>
      <text x="496" y="319" font-size="17" font-weight="700" fill="#f4f5ff">Measure affected tokens</text>
      <text x="892" y="293" font-size="11" letter-spacing="2" fill="#7ae0d3">03 / REVISE</text>
      <text x="892" y="319" font-size="17" font-weight="700" fill="#f4f5ff">Regenerate jointly</text>
    </g>
  </g>
  <path d="M421 303H459M817 303H855" stroke="#9ba7c2" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
