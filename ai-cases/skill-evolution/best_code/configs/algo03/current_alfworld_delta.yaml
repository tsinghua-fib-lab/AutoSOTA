_base_: ../algo02/alfworld.yaml

algo03:
  enabled: true
  compiler_mode: alfworld_delta_patch
  max_failure_cases: 32
  max_success_cases: 32
  max_prune_candidates: 0
  max_demos: 0
  demo_policy: none
  validation_gate: true
  rewrite_reasoning_effort: high
  max_completion_tokens: 16000

env:
  out_root: output/ALGO-03-current/alfworld_delta
