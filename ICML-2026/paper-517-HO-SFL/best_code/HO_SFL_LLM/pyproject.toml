[project]
name = "HO_SFL_LLM"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "datasets",
    "peft",
    "transformers",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "tensorboardx",
    "tqdm",
    "jupyter>=1.1.1",
    "tensorboard>=2.20.0",
    "evaluate>=0.4.6",
    "matplotlib>=3.10.6",
    "wandb>=0.22.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
cu121 = [
    "torch==2.3.*",
    "torchvision==0.18.*",
]
cu128 = [
    "torch==2.7.*",
    "torchvision==0.22.*",
]
cpu = [
    "torch==2.3.*",
    "torchvision==0.18.*",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu121" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
