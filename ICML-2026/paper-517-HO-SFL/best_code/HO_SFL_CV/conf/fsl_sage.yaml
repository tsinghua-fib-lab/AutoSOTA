seed: 42

system:
  device: "cuda:0"

data:
  dataset: "CIFAR10"  
  root: "./data"
  shuffle: True
  train_batch_size: 32
  test_batch_size: 100
  # only for FSL_SAGE
  num_classes: 10
  input_shape: [3, 32, 32]
  
  partition:
    algo: "iid"  
    # algo: "dirichlet"
    # alpha: 1
    min_samples: 32   


model:
  model_name: "ResNet18"
  freeze_bn: True
  use_pretrained: True


algo:
  algo_name: "FSL_SAGE"  
  split_point: 6       
  server_update_interval: 5
  align_interval: 1
  optimizer: "adamw"
  server_lr: 0.001
  client_lr: 0.001
  alignment_buffer_size: 1000
  aux_lr: 0.001

runner:
  communication_rounds: 50
  local_epochs: 1
  evaluation_interval: 1     
  num_clients: 100          
  sampled_clients: 10       
  total_samples: 120000  
logging:
  use_wandb: True
  project_name: "ICML_Code_Test"
  log_dir: "./logs"