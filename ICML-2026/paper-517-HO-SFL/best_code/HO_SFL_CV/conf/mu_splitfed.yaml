seed: 42

system:
  device: "cuda:0"

data:
  dataset: "CIFAR10"  
  root: "./data"
  shuffle: True
  train_batch_size: 32
  test_batch_size: 100
  
  partition:
    algo: "iid"  
    min_samples: 32   


model:
  model_name: "ResNet18"
  freeze_bn: True
  use_pretrained: True


algo:
  algo_name: "MU_SplitFed"  
  split_point: 6
  optimizer: "sgd"    
  lr_g: 0.3
  lr_c: 0.005
  lr_s: 0.01
  tau: 2
  zo_mu: 0.005

runner:
  communication_rounds: 1000
  evaluation_interval: 10     
  num_clients: 100          
  sampled_clients: 10       
  total_samples: 120000  
logging:
  use_wandb: True
  project_name: "ICML_Code_Test"
  log_dir: "./logs/test"