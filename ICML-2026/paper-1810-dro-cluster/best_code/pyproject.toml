[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dro-subspace-clustering"
version = "0.1.0"
description = "Reference implementation for DRO subspace clustering experiments."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kaizheng Wang" },
    { name = "Xiao Xu" },
    { name = "Xunyu Zhou" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
baselines = [
    "cvxpy>=1.4",
    "pyclustering>=0.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
