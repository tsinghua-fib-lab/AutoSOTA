[project]
name = "conformal"
version = "0.1.0"
description = "Fairness in conformal prediction"
requires-python = "==3.12.*"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "seaborn",
    "pyarrow",
    "aiohttp",
    "attrs",
    "requests",
    "jinja2",
    "joblib",
    "packaging",
    "tqdm",
    "pyyaml",
    "regex",
    "networkx",
    "typing-extensions",
    "accelerate",
    "alembic",
    "click",
    "colorlog",
    "crepes",
    "datasets==4.0.0",
    "dill",
    "evaluate",
    "fsspec==2024.12.0",
    "ftfy",
    "greenlet",
    "huggingface-hub",
    "hydra-core",
    "lightning-utilities",
    "mako",
    "nltk",
    "optuna",
    "psutil",
    "pyarrow-hotfix",
    "seqeval",
    "sqlalchemy",
    "sympy==1.13.3",
    "soundfile",
    "tokenizers",
    "torchmetrics",
    "transformers",
    "unidecode",
    "wcwidth",
    "omegaconf",
    "openai",
    "statsmodels",
    "folktables",
    "tabpfn",
    "xgboost",
    "torch",
    "torchvision",
    "torchaudio"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["internal*", "substantive*"]
