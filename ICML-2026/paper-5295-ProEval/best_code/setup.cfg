[metadata]
# Most metadata lives in pyproject.toml (PEP 621). This file keeps
# tooling configuration (flake8, mypy, coverage) for ecosystems that
# don't read pyproject.toml yet.
name = proeval
version = 0.1.0

[options]
zip_safe = False

[flake8]
max-line-length = 100
extend-ignore =
    E203,
    E501,
    W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    data,
    experiment

[mypy]
python_version = 3.9
ignore_missing_imports = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
exclude = (?x)(
    ^build/
    | ^dist/
    | ^data/
    | ^experiment/
  )

[coverage:run]
source = proeval
omit =
    proeval/*/__init__.py
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
