[project]
name = "dist-match"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "darts>=0.44.1",
    "doubt[all]>=4.1.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.9",
    "neuralhydrology>=1.13.0",
    "numpy==1.26.4",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "seaborn>=0.13.2",
    "sklearn-quantile>=0.0.32",
    "statsmodels>=0.14.6",
    "torch==1.13.1",
    "torchaudio==0.13.1",
    "torchvision==0.14.1",
    "wandb>=0.26.1",
    "xgboost>=3.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu117", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu117", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
