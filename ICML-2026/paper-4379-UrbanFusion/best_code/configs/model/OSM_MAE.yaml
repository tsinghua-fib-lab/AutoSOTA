_target_: srl.OSM_map_MAE.OSM_MAE_trainer.MAELitModule
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.00001
  betas:
    - 0.9
    - 0.999
  eps: 1e-8
  amsgrad: False
  _partial_: true

scheduler:
  _target_: scripts.lr_schedule.cosine_schedule.CosineSchedule
  steps_total: 100
  steps_warmup: 10
  cycles: 0.5
  last_epoch: -1
  _partial_: true

model:
  _target_: srl.OSM_map_MAE.OSM_MAE.MaskedAutoencoderViT
  pretrained_model_name: "facebook/vit-mae-base"
  mask_ratio: 0.75

plot_dir: "${paths.output_dir}/plots"