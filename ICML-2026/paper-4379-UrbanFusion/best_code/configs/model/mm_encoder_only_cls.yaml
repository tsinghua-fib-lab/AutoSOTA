_target_: srl.multi_modal_encoder.mm_trainer.LightningMultiModalModel

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.00001
  betas:
    - 0.9
    - 0.999
  eps: 1e-8
  amsgrad: False
  _partial_: true

scheduler:
  _target_: scripts.lr_schedule.cosine_schedule.CosineSchedule
  steps_total: 100
  steps_warmup: 10
  cycles: 0.5
  last_epoch: -1
  _partial_: true

loss:
  _target_: scripts.loss.clip_loss.CLIPLoss
  initial_temperature: 0.07
  max_logit_scale: 100
  fixed_temperature: null
  normalize: True
  reduction: "mean"
  label_smoothing_type: null
  label_smoothing_epsilon: 0.1
  temperature_label_smoothing: 0.07
  use_js_divergence: False
  lmbd: 5e-3
  u: 1
  v: 1
  epsilon: 1e-3
  variance_covariance_reg_bool: False
  variance_covariance_reg_weight: 0.3

model:
  _target_: srl.multi_modal_encoder.multi_modal_transformer.MultiModalTransformer
  encoders: ${encoder}
  transformer_type: "single"
  embed_dim: 256
  only_cls: True
  avg_pool: False
  depth: 3
  num_heads: 4
  head: "linear"
  head_contrastive_dim: 256
  head_hidden_dim: 256
  name_vit_architecture: null
  pretrained: False
  first_n_layers: 3
  reg_tokens: 0
  mlp_ratio: 4.0
  qkv_bias: True
  qk_norm: False
  proj_bias: True
  proj_drop_rate: 0.0
  attn_drop_rate: 0.0
  add_positional_encodings: True
  lora_init: "xavier_uniform"
  lora_init_settings: null
  lora_rank: 8
  lora_chunk_size: null
  normalize_embedding: True

plot_representation_space:
  save_representations_val: false
  save_representations_test: false
  save_plots: true
  show_plots: false
  plot_val: true
  val_n_epochs: 5
  plot_test: true
  token_index: 0
  title: "Image is Masked, CLS"
  save_dir: ${hydra:run.dir}/plots # Uses Hydra's run directory
  mask_indices:
    - 0

# compile model for faster training with pytorch 2.0
compile: false

val_metrics:
  - "accuracy"
  - "r2_metric"

test_metrics:
  - "accuracy"
  - "r2_metric"

r2_metric_distance: "cosine"

top_k_accuracy: 5
