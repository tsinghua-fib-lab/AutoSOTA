# @package _global_

# ====================================================
# Early experiments of SMF on synthetic data for
# analyzing partial information decomposition (PID)
# ====================================================

defaults:
  - override /data: syntheticIPD
  - override /model: mm_encoder_only_cls
  - override /encoder: syntheticPID/encoders_syntheticPID_1
  - override /callbacks: default

data:
  batch_size: 256
  num_workers: 0
  persistent_workers: False
  pin_memory: true

trainer:
  max_epochs: 250 # 20
  precision: "16-mixed"
  check_val_every_n_epoch: 250
  #limit_train_batches: 0.1
  #limit_val_batches: 0.2
  #limit_test_batches: 0.2

model:
  optimizer:
    _target_: torch.optim.SGD
    lr: 0.0003
    weight_decay: 0
    momentum: 0.9

  model:
    transformer_type: "single"
    embed_dim: 9
    head_hidden_dim: 9
    hourglass_dim: 9
    head_contrastive_dim: 9
    num_heads: 1
    only_cls: True
    avg_pool: True
    head: "hourglass_tiny"
    reconstruction_head_dim: 8
    depth: 1

  scheduler:
    steps_total: 23500 # 29 iterations per epoch with batch size 2560 (73028 samples for train)
    steps_warmup: 0 # 5% of total steps

  plot_representation_space:
    save_representations_val: false
    save_representations_test: True
    save_plots: true
    show_plots: false
    plot_val: true
    val_n_epochs: 10
    plot_test: true
    token_index: 0
    title: "Image is Masked (only coordinate), CLS"
    save_dir: ${hydra:run.dir}/plots # Uses Hydra's run directory
    mask_indices:
      - 0

  loss:
    _target_: scripts.loss.clip_loss.CLIPLoss
    initial_temperature: 0.07
    max_logit_scale: 100
    fixed_temperature: null
    normalize: True
    reduction: "mean"
    label_smoothing_type: null
    label_smoothing_epsilon: 0.1
    temperature_label_smoothing: 0.07
    use_js_divergence: False
    lmbd: 0
    u: 1
    v: 0
    epsilon: 1e-3
    variance_covariance_reg_bool: False
    reconstruction_loss_weight: 0.9
    mean_vector_path: "${paths.data_dir}/svi_data/syntheticPID/mean_vector_syntheticPID.npy"
    std_vector_path: "${paths.data_dir}/svi_data/syntheticPID/std_vector_syntheticPID.npy"
    scaling_vector_path: "${paths.data_dir}/svi_data/syntheticPID/scaling_vector_syntheticPID.npy"
    number_modalities: 3
  modality_reconstruction: True
  cartesian_p_final: 0.2

callbacks:
  early_stopping:
    monitor: "val_loss_dataloader_0/dataloader_idx_0"
  model_checkpoint:
    monitor: "val_loss_dataloader_0/dataloader_idx_0"

task_name: "UrbanFusionV1SyntheticPID_4"

seed: 42
# python scripts/train.py experiment=syntheticPID/UrbanFusionV1SyntheticPID_4 ~model.optimizer.betas ~model.optimizer.eps ~model.optimizer.amsgrad
