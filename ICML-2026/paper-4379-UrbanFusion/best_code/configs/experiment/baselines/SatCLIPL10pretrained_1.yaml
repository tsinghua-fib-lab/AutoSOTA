# @package _global_

# ====================================================
# SatCLIP baseline, pretrained on S2-100K data. This
# config evaluates the model's performance on the PP2-M
# dataset. The model is not trained on PP2-M data.
# Hyperparameter L in the location encoder is set to 10.
# ====================================================

defaults:
  - override /encoder: placepulse2/encoders_placepulse2_2
  - override /data: place_pulse2
  - override /model: satclip
  - override /callbacks: default

data:
  batch_size: 8192
  num_workers: 4
  persistent_workers: True
  pin_memory: True
  out_region_cities:
    [
      "Cape Town",
      "Singapore",
      "Rio De Janeiro",
      "Paris",
      "Milan",
      "New York",
      "Sydney",
    ]
  in_region_split: 0.2
  return_filename: false
  return_coords: false
  filter_available_images: False
  modalities: ["coords", "sentinel2"]
  precomputed_h5_path: "${paths.h5_dir}/svi_data/place-pulse-2.0/01_06_2025_legendre_polys_10_bge-small-en-v1.5.h5"
  coordinate_predictions:
    [
      "${paths.data_dir}/svi_data/place-pulse-2.0/downstreamtask_data/London_Energy_Usage/London_Energy_Usage_locations.csv",
      "${paths.data_dir}/svi_data/place-pulse-2.0/downstreamtask_data/London_Housing_Prices/London_Housing_Prices_locations.csv",
    ]

trainer:
  max_epochs: 400 # 20
  precision: "16-mixed"
  check_val_every_n_epoch: 10

model:
  embed_dim: 256
  legendre_polys: 10
  learning_rate: 0.0001
  weight_decay: 0.01
  pretrained_weights_path: "${paths.data_dir}/svi_data/place-pulse-2.0/encoder_weights/satclip-vit16-l10.ckpt"
  precomputed_features: True

callbacks:
  early_stopping:
    monitor: "val_loss_dataloader_0/dataloader_idx_0"
  model_checkpoint:
    monitor: "val_loss_dataloader_0/dataloader_idx_0"

task_name: "SatCLIPL10pretrained_1"
train: False
test: True
