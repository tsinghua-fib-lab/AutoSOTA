# -----------------------------------------------------------------------------
# Decoder1d (explicit params, including defaults)
# -----------------------------------------------------------------------------
# Used by:
# - Autoencoder training (read by `src/train/autoencoder.py`)
# - Any Hydra instantiation that targets `models.autoencoder.decoder1d.Decoder1d`

_target_: "models.autoencoder.decoder1d.Decoder1d"
model_name: "Decoder1d"

out_channels: 1
hidden_channels: 32
z_channels: 4
ch_mult: [1, 2, 4, 8]
num_res_blocks: 2
resolution: 256
attn_resolutions: [32]

# Optional/legacy kwargs (defaults explicit)
dropout: 0.0
double_z: true
cond_channels: 0
tanh_out: false
padding_mode: "circular"
use_attn: false
