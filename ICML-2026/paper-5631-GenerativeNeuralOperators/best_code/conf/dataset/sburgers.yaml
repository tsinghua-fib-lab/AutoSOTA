_target_: data.build_sburgers_dataset

data_name: SBurgers

dataset_dir: "datasets"
filename: "sburgers.pt"
save_data: true
verbose: true
overwrite: false

# Enable stochastic payloads for evaluation.mode: stochastic
return_stochastic: true

# Grid / PDE
num_points: 256
# NOTE: In our SBurgers builder, `dt` is the macro step (dt_macro).
# Noise model: du = ... + noise_scale * sum_{i=1..m} cos(i x) dW^i_t with independent Brownian motions.
L: 6.283185307179586  # 2*pi
dt: 1.0               # dt_macro
dt_sim: 1.0e-4
nu: 0.1

# Stochasticity
noise_scale: 1.0      # overall amplitude multiplier on sum_i cos(i x) dW^i
noise_num_modes: 1    # fallback number of independent noise terms when noise_modes is null
# If you want specific modes (e.g. cos(x), cos(3x), cos(5x)) with per-mode weights:
noise_modes: [1, 3, 5]          # e.g. [1, 3, 5]
noise_mode_weights: [1.0, 0.5, 0.1]   # e.g. [1.0, 0.5, 0.25] (same length as noise_modes); defaults to all-ones
dealias: true

# Dataset sizes
n_train_inputs: 10000
n_val_inputs: 32
n_test_inputs: 32
n_outputs_per_input_train: 1
n_outputs_per_input_eval: 64

# Initial condition distribution (smooth GRF)
u0_amp: 1.0
u0_length_scale: 0.15

# Seed
seed: 42

