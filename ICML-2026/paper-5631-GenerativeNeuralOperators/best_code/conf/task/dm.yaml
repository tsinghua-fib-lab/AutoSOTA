# @package _global_
# Base diffusion model task configuration
# Can be overridden by dataset-specific configs (e.g., darcy/dm.yaml, ks/dm.yaml)
defaults:
  - /optimizer: adamw
  # Model selection: override in dataset-specific configs
  # Options: cond_unet1d, cond_unet2d, cond_mlp
  - /model: ???
  - _self_

# Which training routine to run from `src/main.py`
run: dm

evaluation:
  mode: ???

# Train loop settings
training:
  epochs: 500
  batch_size: 128
  num_workers: 4
  normalization_mode: gaussian
  check_val_every_n_epoch: 25
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

dm:
  T: 10
  samples_per_example: 8
  ema_decay: 0.999
  test_samples_per_example: null
  rollout_k_chunk: 8
  rollout_traj_chunk: null

# Cosine annealing learning rate scheduler
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${training.epochs}
    eta_min: 0.0
  interval: epoch
  frequency: 1

logging:
  save_dir: "wandb_logs"
  log_model: true

