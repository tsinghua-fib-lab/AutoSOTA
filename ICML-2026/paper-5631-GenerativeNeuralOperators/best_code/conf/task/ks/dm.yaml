# @package _global_
defaults:
  - /task/dm  # Base DM task config
  - override /optimizer: adamw
  - override /model: cond_unet1d
  - _self_

evaluation:
  mode: rollout

dm:
  T: 10
  model:
    resolution: 256
  # Chunk size for autoregressive rollout evaluation (over flattened K*N_traj).
  # Useful when using large `samples_per_example` at validation/test time.
  test_samples_per_example: 32
  rollout_k_chunk: 8
  rollout_traj_chunk: 64
