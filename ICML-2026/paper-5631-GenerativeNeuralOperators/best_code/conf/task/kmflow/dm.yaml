# @package _global_
defaults:
  - /task/dm  # Base DM task config
  - override /optimizer: adamw
  - override /model: cond_unet2d
  - _self_

evaluation:
  mode: rollout

training:
  batch_size: 32

dm:
  T: 10
  model:
    resolution: 128
  # Chunk size for autoregressive rollout evaluation (over flattened K*N_traj).
  test_samples_per_example: 32
  rollout_k_chunk: 8
  rollout_traj_chunk: 64


