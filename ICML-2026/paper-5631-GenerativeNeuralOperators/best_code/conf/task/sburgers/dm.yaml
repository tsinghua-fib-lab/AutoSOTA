# @package _global_
defaults:
  - /task/dm  # Base DM task config
  - override /optimizer: adamw
  - override /model: cond_unet1d
  - _self_

evaluation:
  mode: stochastic

training:
  epochs: 100
  batch_size: 64
  check_val_every_n_epoch: 1
  share_xy_normalizer: false

dm:
  samples_per_example: 32
  test_samples_per_example: 32


