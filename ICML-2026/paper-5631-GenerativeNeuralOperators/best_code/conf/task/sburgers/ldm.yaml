# @package _global_
defaults:
  - /task/ldm  # Base LDM task config
  - override /model@ldm.model: cond_unet1d
  - override /optimizer@ldm.optimizer: adamw
  - override /optimizer@autoencoder.optimizer: adamw
  - override /model@autoencoder.encoder: encoder1d
  - override /model@autoencoder.decoder: decoder1d
  - _self_

evaluation:
  mode: stochastic

ae_model_name: AE1d

cond:
  mode: shared_ae
  # mode: learned_encoder
  # # Reuse the same architecture as the target AE encoder, but learn it for conditioning inside LDM.
  # encoder: ${autoencoder.encoder}

training_ldm:
  epochs: 100
  batch_size: 64
  check_val_every_n_epoch: 1
  share_xy_normalizer: false
training_ae:
  epochs: 100
  batch_size: 64
  check_val_every_n_epoch: 1

ldm:
  samples_per_example: 32
  test_samples_per_example: 32


