# @package _global_
defaults:
  - /task/pno
  - override /optimizer: adamw
  - override /model: fno2d
  - _self_

evaluation:
  mode: stochastic

training:
  epochs: 100
  batch_size: 64
  check_val_every_n_epoch: 1
  share_xy_normalizer: false

# IMPORTANT: model must output (mu, rho) or 2*C channels for (mu, rho)

# Override output channels for (mu, rho)
model:
  out_channels: 2

pno:
  samples_per_example: 32
  test_samples_per_example: 32
  # Keep stochastic evaluation memory bounded for large 2D fields.
  stochastic_n_chunk: 8
  stochastic_k_chunk: 4
