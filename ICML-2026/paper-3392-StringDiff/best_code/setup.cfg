[metadata]
name = diffusion-strings
version = 0.1.0
description = Diffusion string method utilities.

[options]
packages = find:
python_requires = >=3.10
install_requires =
    torch
    tqdm

[options.packages.find]
where = .
include =
    diffusion_strings*

[options.extras_require]
test =
    pytest>=8
dev =
    pytest>=8
