name: sweep_oewc_all
method: grid
project: paper-sweeps
metric:
  goal: maximize
  name: final_avg_accuracy

parameters:
  method:
    value: oewc

  setting:
    values:
      - TaskILMNIST5Task_Encoded
      - ClassILMNIST5Task_Encoded
      - TaskILCIFAR10
      - ClassILCIFAR5Task

  layer_size:
    value: 100

  # Hyperparameters to sweep
  lr:
    values:
      - 1e-5
      - 3e-5
      - 1e-4
      - 3e-4

  importance_ewc:
    values:
      - 0.1
      - 1
      - 10
      - 100
      - 1000

  gamma_oewc:
    values:
      - 0.9
      - 0.95
      - 0.99

  normalize_fisher:
    value: True

  # Fixed parameters
  batch_size:
    value: 256
  num_workers:
    value: 0
  epochs:
    value: 20
  optimizer:
    value: Adam
  cnn_pretrained:
    value: True

  # Seeds for reproducibility
  seed:
    values:
      - 0
      - 1
      - 2

program: train.py
