name: test_efc_mnist_classil
project: paper-reproduction
metric:
  goal: maximize
  name: final_avg_accuracy

parameters:
  setting:
    value: ClassILMNIST5Task
  method:
    value: efc
  layer_size:
    value: 100
  batch_size:
    value: 256
  num_workers:
    value: 0
  epochs:
    value: 1
  optimizer:
    value: Adam
  lr:
    value: 3e-5
  beta_efc:
    value: 1
  target_lr:
    value: 0.01
  alpha_di:
    value: 0.0017
  alpha_I:
    value: 0.0017
  tau:
    value: 0.032
  eps:
    value: 0.0001
  dt_di:
    value: 0.02
  time_constant_ratio:
    value: 0.2
  tmax_di:
    value: 500
  k_p:
    value: 2.0
  mode:
    value: di
  seed:
    value: 0
  cnn_pretrained:
    value: false

program: train.py
