name: bp_taskIL_CIFAR10
method: grid
project: paper-sweeps
metric:
  goal: maximize
  name: final_avg_accuracy

parameters:
  setting:
    value: TaskILCIFAR10

  method:
    value: bp

  layer_size:
    value: 100

  # Fixed parameters
  batch_size:
    value: 256
  num_workers:
    value: 0
  epochs:
    value: 20
  optimizer:
    value: Adam
  lr:
    value: 0.003

  cnn_pretrained:
    value: True

  # Seeds for reproducibility
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4

program: train.py
