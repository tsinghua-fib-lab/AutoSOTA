name: oewc_classIL_TinyImageNet
method: grid
project: paper-sweeps
metric:
  goal: maximize
  name: final_avg_accuracy

parameters:
  setting:
    value: ClassILTinyImageNet10Task

  method:
    value: oewc

  layer_size:
    value: 1000

  # Fixed parameters
  batch_size:
    value: 256
  num_workers:
    value: 0
  epochs:
    value: 20
  optimizer:
    value: Adam
  lr:
    value: 0.0001

  cnn_pretrained:
    value: True

  # Seeds for reproducibility
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4

  # oEWC parameters
  importance_ewc:
    value: 0.1
  gamma_oewc:
    value: 0.95
  normalize_fisher:
    value: True

program: train.py
