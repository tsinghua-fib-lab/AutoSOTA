name: dt5_wide_rep
module_path: static.inverse_gamma_variance_closed_form
seed: 3

n_components: 5

meta_prior_kwargs:
  concentration_concentration: 4
  concentration_rate: 6
  rate_concentration: 4
  rate_rate: 6

observation_loc:
  obs_1: [0]

distribution_embedding_kwargs:
  embedding_hidden_layer_sizes: [32]
  embedding_activation: gelu
  conversion_hidden_layer_sizes: [64]
  conversion_activation: gelu

component_embedding_kwargs:
  hidden_layer_sizes: [32]
  activation: gelu
  jitter: 0.000001
  eps: null
  scale_parametrisation: scale_tril

observation_embedding_kwargs:
  obs_1:
    hidden_layer_sizes: [32]
    activation: gelu

transformer_kwargs:
  d_model: 64
  n_head: 8
  dim_feedforward: 256
  dropout: 0
  num_layers: 6
  activation: gelu

kind: DistributionTransformer

training_kwargs:
  warmup_epochs: 15
  epochs: 60
  steps_per_epoch: 100
  batch_size: 5000
  lr: 0.002
  weight_decay: 0
  verbose: True
  progress_bar: True
  save_interval: -1
  save_loss_series: False
  use_prior_loss: True
  gpu_device: cuda:1

testing_kwargs:
  n_test_priors: 1000
  n_kl_samples: 10000
  plot: False
  competitor_kwargs: {}
  gpu_device: cuda:1
