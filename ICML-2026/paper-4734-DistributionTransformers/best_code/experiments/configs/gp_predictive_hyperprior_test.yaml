observation_covariance_matrix:
  obs_1: [[10]]
  obs_2: [[0.01]]

distribution_embedding_kwargs:
  embedding_hidden_layer_sizes: [256, 256]
  embedding_activation: gelu
  conversion_hidden_layer_sizes: [256, 256]
  conversion_activation: gelu

component_embedding_kwargs:
  hidden_layer_sizes: [256]
  activation: gelu
  jitter: 0.000001
