# CFNet architecture config
# For complex tasks with high-dimensional observations (pendulum, js, tunnels)
# Requires task-specific dimension overrides
#
# Use: defaults: [architecture: cfnet]
# Then override: architecture.flow_theta.params.drift.posterior_kwargs.input_dim

name: cfnet

# Flow for theta|y
flow_theta:
  space: "data"
  conditional: True
  probability_path: "ot2"
  prior: 'uniform'
  base_dist: 'gaussian'
  params:
    probability_path_params: {"sigma_min": 1e-4}
    base_dist_params: {}
    drift:
      architecture: "cfnet"
      posterior_kwargs:
        input_dim: ???  # Must be overridden by task
        dropout: 0.0
        batch_norm: False
        context_dim: 10
        theta_with_glu: True
        context_with_glu: False
        activation: "gelu"
        hidden_dims: [32, 64, 128, 256, 256, 128, 64, 32]
      embedding_kwargs:
        name: "identity"
        output_dim: 10

# Flow for x|y
flow_x:
  space: "data"
  conditional: True
  probability_path: "ot2"
  prior: 'uniform'
  base_dist: 'data_eps'
  params:
    probability_path_params: {"sigma_min": 1e-4}
    base_dist_params: {"eps": 5e-2}
    drift:
      architecture: "cfnet"
      posterior_kwargs:
        input_dim: ???  # Must be overridden by task
        dropout: 0.0
        batch_norm: True
        context_dim: 10
        theta_with_glu: False
        context_with_glu: False
        activation: "gelu"
        hidden_dims: [32, 64, 128, 256, 512, 256, 128, 64, 32]
      theta_embedding_kwargs:
        name: "identity"
        time_embedding: True
        output_dim: 10
        n_freqs: 5
      embedding_kwargs:
        name: "identity"
        output_dim: 10
