# No-Misspecification Gaussian task
#
# Same as high_dim_gaussian but with C=I, d=0, Σ_noise≈0.
# Used to verify FMCPE degrades gracefully to NPE when there is no misspecification.
#
# Architecture: resmlp
# Rescaling: none

name: "no_misspec_gaussian"
num_samples: 50000
rescale: "none"
generation: "independent"
num_cal: [10, 50, 200, 1000]
use_sbi: False
naugment: 1

# Task-specific simulator configuration
simulator:
  name: "pure_gaussian"
  params:
    theta_dim: 3
    obs_dim: 10
    prior_var_scale: 1
    likelihood_var_scale: 1
    noisy_var_scale: 0.1
    seed: 0
    no_misspecification: true

# =============================================================================
# Method configurations - inherit from high_dim_gaussian
# =============================================================================

npe:
  training:
    lr: 1e-4
    batch_size: 512
    epochs: 2000
    train_size: 0.8
    max_patience: 20
    rescale: ${task.rescale}
  density_estimator: 'nsf'
  params:
    embedding_net: {}
    npe_params:
      transforms: 5
      hidden_features: [64, 64]
      bins: 8

fmpe:
  config:
    space: "data"
    conditional: True
    probability_path: "ot2"
    prior: 'power'
    base_dist: 'gaussian'
    params:
      probability_path_params: {}
      prior_params: {"rate": 2.0}
      base_dist_params: {}
      drift:
        architecture: "resmlp"
        hidden_dim: [64, 64, 64, 64, 64]
        mlp_params: {}
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 200
    batch_size: 256
    max_patience: 20
    train_size: 0.8

fmcpe_fm:
  training_params:
    rescale: ${task.rescale}
    max_patience: 20

fm_post_transform:
  config:
    npe: "fmpe"
    flow_theta:
      space: "data"
      conditional: True
      probability_path: "ot2"
      prior: 'power'
      base_dist: 'gaussian'
      params:
        probability_path_params: {}
        prior_params: {"rate": 2.0}
        base_dist_params: {}
        drift:
          architecture: "resmlp"
          hidden_dim: [64, 64, 64, 64, 64]
          mlp_params: {}
    flow_x:
      space: "data"
      conditional: True
      probability_path: "ot2"
      prior: 'power'
      base_dist: 'gaussian'
      params:
        probability_path_params: {}
        prior_params: {"rate": 2.0}
        base_dist_params: {}
        drift:
          architecture: "resmlp"
          hidden_dim: [64, 64, 64, 64, 64]
          mlp_params: {}
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 200
    batch_size: 256
    max_patience: null
    train_size: 0.8

fm_post_transform_only_ut:
  training_params:
    rescale: ${task.rescale}
    max_patience: 20

fm_post_transform_plug_y:
  training_params:
    rescale: ${task.rescale}
    max_patience: 20

# Baselines
dpe:
  training:
    lr: 1e-4
    batch_size: 512
    epochs: 2000
    train_size: 0.8
    rescale: ${task.rescale}
  density_estimator: 'nsf'
  params:
    embedding_net: {}
    npe_params:
      transforms: 5
      hidden_features: [64, 64]
      bins: 8

rope:
  config:
    tau: 1.0
    gamma: 1.0
  training_params:
    lr: 1e-5
    epochs: 1000
    batch_size: 100
    max_patience: 10
    train_size: 0.8
    rescale: ${task.npe.training.rescale}

mf_npe:
  training:
    lr: 1e-5
    batch_size: 256
    epochs: 500
    train_size: 0.8
    max_patience: 20
    rescale: ${task.npe.training.rescale}

npe_pfn:
  filter_type: "latest_filtering"
  filter_context_size: 10000
