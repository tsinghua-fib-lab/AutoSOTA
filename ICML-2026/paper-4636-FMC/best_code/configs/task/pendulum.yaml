# Pendulum task - refactored
#
# Architecture: cfnet with conv1d embeddings
# Data: Synthetic pendulum time series

name: "pendulum"
num_samples: 50000
rescale: "none"
generation: "independent"
num_cal: [10, 50, 200, 1000]
naugment: 1

# Task-specific simulator configuration
simulator:
  name: pendulum
  params:
    obs_dim: 200
    low_w0: 0.0
    high_w0: 3.0
    low_A: 0.5
    high_A: 10.0
    tmax: 10.0

# =============================================================================
# Shared architecture definitions (YAML anchors for DRY within this file)
# =============================================================================

flow_x_common: &flow_x_defaults
  space: "data"
  conditional: True
  probability_path: "ot2"
  prior: 'uniform'
  base_dist: 'data_eps'
  params:
    probability_path_params: {"sigma_min": 1e-4}
    base_dist_params: {"eps": 5e-2}
    drift:
      architecture: "cfnet"
      posterior_kwargs:
        input_dim: ${task.simulator.params.obs_dim}
        dropout: 0.0
        batch_norm: True
        context_dim: 10
        theta_with_glu: False
        context_with_glu: False
        activation: "gelu"
        hidden_dims: [32, 64, 128, 256, 512, 256, 128, 64, 32]
      theta_embedding_kwargs:
        name: "conv1d"
        time_embedding: True
        output_dim: 10
        n_freqs: 5
      embedding_kwargs:
        name: "conv1d"
        output_dim: 10

flow_theta: &flow_theta_defaults
  space: "data"
  conditional: True
  probability_path: "ot2"
  prior: 'uniform'
  base_dist: 'gaussian'
  params:
    probability_path_params: {"sigma_min": 1e-4}
    base_dist_params: {}
    drift:
      architecture: "cfnet"
      posterior_kwargs:
        input_dim: 2
        dropout: 0.0
        batch_norm: False
        context_dim: 10
        theta_with_glu: True
        context_with_glu: False
        activation: "gelu"
        hidden_dims: [32, 64, 128, 256, 256, 128, 64, 32]
      embedding_kwargs:
        name: "conv1d"
        output_dim: 10

# =============================================================================
# Method configurations
# =============================================================================

fmcpe_fm:
  config: *flow_x_defaults
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 300
    batch_size: 256
    max_patience: 20
    train_size: 0.8

fm_post_transform:
  config:
    npe: "fmpe"
    flow_x: *flow_x_defaults
    flow_theta: *flow_theta_defaults
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 300
    batch_size: 256
    max_patience: null  # No early stopping, return model at last epoch
    train_size: 0.8

fm_post_transform_only_ut:
  config:
    npe: "fmpe"
    flow_x: *flow_x_defaults
    flow_theta: *flow_theta_defaults
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 300
    batch_size: 256
    max_patience: 20
    train_size: 0.8

fm_post_transform_plug_y:
  config:
    npe: "fmpe"
    flow_theta: *flow_theta_defaults
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 500
    batch_size: 256
    max_patience: 20
    train_size: 0.8

# =============================================================================
# Baselines
# =============================================================================

npe:
  training:
    lr: 1e-4
    batch_size: 256
    epochs: 2000
    train_size: 0.8
    max_patience: 20
    rescale: ${task.rescale}
  params:
    embedding_net:
      model_path: 'models'
      load: False
      save: 'last_'
      output_dim: 10
      image_size: ${task.simulator.params.obs_dim}
    npe_params:
      embedding_dim: 10
      ntransform: 1

fmpe:
  config:
    space: "data"
    conditional: True
    probability_path: "ot2"
    prior: 'power'
    base_dist: 'gaussian'
    params:
      probability_path_params: {"sigma_min": 1e-4}
      prior_params: {"rate": 2.0}
      base_dist_params: {}
      drift:
        architecture: "cfnet"
        posterior_kwargs:
          input_dim: 2
          dropout: 0.0
          batch_norm: False
          context_dim: 10
          theta_with_glu: True
          context_with_glu: False
          activation: "gelu"
          hidden_dims: [32, 64, 128, 256, 256, 128, 64, 32]
        embedding_kwargs:
          name: "conv1d"
          output_dim: 10
  training_params:
    rescale: ${task.rescale}
    lr: 1e-3
    epochs: 300
    batch_size: 256
    max_patience: 20
    train_size: 0.8

dpe:
  training:
    lr: 1e-4
    batch_size: 256
    epochs: 2000
    train_size: 0.8
    max_patience: 20
    rescale: ${task.rescale}
  params:
    embedding_net:
      model_path: 'models'
      load: False
      save: 'last_'
      output_dim: 10
      image_size: ${task.simulator.params.obs_dim}
    npe_params:
      embedding_dim: 10
      ntransform: 1
rope:
  config:
    tau: 1.0
    gamma: 1.0
  training_params:
    lr: 1e-5
    epochs: 1000
    max_patience: 20
    batch_size: 100
    train_size: 0.8
    rescale: ${task.npe.training.rescale}

npe_rs:
  training:
    lr: 1e-4
    batch_size: 256
    epochs: 2000
    train_size: 0.8
    max_patience: 20
    rescale: ${task.rescale}
    mmd_weight: 10.0
  params:
    embedding_net:
      model_path: 'models'
      load: False
      save: 'last_'
      output_dim: 10
      image_size: ${task.simulator.params.obs_dim}
    npe_params:
      embedding_dim: 10
      ntransform: 1

mf_npe:
  # MF-NPE: Misspecification-Finetuned NPE
  # Uses pretrained NPE architecture, finetunes on calibration data (theta, y)
  training:
    lr: 1e-5  # Lower LR for finetuning
    batch_size: 128
    epochs: 500
    train_size: 0.8
    max_patience: 20
    rescale: ${task.npe.training.rescale}

npe_pfn:
  # NPE-PFN: TabPFN-based Neural Posterior Estimation
  # Uses in-context learning instead of gradient descent
  filter_type: "latest_filtering"
  filter_context_size: 10000
