# High-dimensional Adaptive Gaussian task - refactored
#
# Architecture: cfnet (high-dimensional)
# Special: Uses cfnet architecture with task-specific dimensions

name: "high_dim_adaptive_gaussian"
num_samples: 50000
rescale: "none"
generation: "transitive"
use_sbi: False
num_cal: [10, 50, 200, 1000]
naugment: 1

# Task-specific simulator configuration
simulator:
  name: "high_dim_adaptive_gaussian"
  params:
    theta_dim: 3
    obs_dim: 15
    prior_var_scale: 1
    likelihood_var_scale: 1
    noisy_var_scale: 0.1
    s: 0.4
    t: 1.6
    complex: "simulator"
    seed: 0

# =============================================================================
# Method configurations
# This task uses cfnet architecture with specific hidden dims
# =============================================================================

npe:
  training:
    lr: 1e-4
    batch_size: 1024
    epochs: 200
    train_size: 0.8
    max_patience: 20
    rescale: ${task.rescale}
  density_estimator: 'nsf'
  params:
    embedding_net: {}
    npe_params:
      transforms: 5
      bins: 8

fmpe:
  training_params:
    max_patience: 20

# CFNet architecture used by calibration methods
fmcpe_fm:
  config:
    space: "data"
    conditional: True
    probability_path: "ot2"
    prior: 'uniform'
    base_dist: 'gaussian'
    params:
      probability_path_params: {"sigma_min": 1e-4}
      base_dist_params: {}
      drift:
        architecture: "cfnet"
        posterior_kwargs:
          input_dim: ${task.simulator.params.obs_dim}
          dropout: 0.0
          batch_norm: False
          context_dim: ${task.simulator.params.obs_dim}
          theta_with_glu: True
          context_with_glu: False
          activation: "gelu"
          hidden_dims: [32, 64, 128, 256, 256, 128, 64, 32]
  training_params:
    lr: 1e-3
    epochs: 200
    batch_size: 256
    max_patience: 10
    train_size: 0.8

fm_post_transform:
  config:
    npe: "fmpe"
    flow_theta:
      space: "data"
      conditional: True
      probability_path: "ot2"
      prior: 'uniform'
      base_dist: 'gaussian'
      params:
        probability_path_params: {"sigma_min": 1e-4}
        base_dist_params: {}
        drift:
          architecture: "cfnet"
          posterior_kwargs:
            input_dim: ${task.simulator.params.theta_dim}
            dropout: 0.0
            batch_norm: False
            context_dim: ${task.simulator.params.obs_dim}
            theta_with_glu: True
            context_with_glu: False
            activation: "gelu"
            hidden_dims: [32, 64, 128, 128, 64, 32]
    flow_x:
      space: "data"
      conditional: True
      probability_path: "ot2"
      prior: 'uniform'
      base_dist: 'gaussian'
      params:
        probability_path_params: {"sigma_min": 1e-4}
        base_dist_params: {}
        drift:
          architecture: "cfnet"
          posterior_kwargs:
            input_dim: ${task.simulator.params.obs_dim}
            dropout: 0.2
            batch_norm: True
            context_dim: ${task.simulator.params.obs_dim}
            theta_with_glu: True
            context_with_glu: False
            activation: "gelu"
            hidden_dims: [32, 64, 128, 256, 256, 128, 64, 32]
  training_params:
    lr: 1e-3
    epochs: 300
    batch_size: 128
    max_patience: null  # No early stopping, return model at last epoch
    train_size: 0.8

fm_post_transform_only_ut:
  config:
    npe: "fmpe"
    flow_theta:
      space: "data"
      conditional: True
      probability_path: "ot2"
      prior: 'uniform'
      base_dist: 'gaussian'
      params:
        probability_path_params: {"sigma_min": 1e-4}
        base_dist_params: {}
        drift:
          architecture: "cfnet"
          posterior_kwargs:
            input_dim: ${task.simulator.params.theta_dim}
            dropout: 0.0
            batch_norm: False
            context_dim: ${task.simulator.params.obs_dim}
            theta_with_glu: True
            context_with_glu: False
            activation: "gelu"
            hidden_dims: [32, 64, 128, 128, 64, 32]
    flow_x:
      space: "data"
      conditional: True
      probability_path: "ot2"
      prior: 'uniform'
      base_dist: 'gaussian'
      params:
        probability_path_params: {"sigma_min": 1e-4}
        base_dist_params: {}
        drift:
          architecture: "cfnet"
          posterior_kwargs:
            input_dim: ${task.simulator.params.obs_dim}
            dropout: 0.2
            batch_norm: True
            context_dim: ${task.simulator.params.obs_dim}
            theta_with_glu: True
            context_with_glu: False
            activation: "gelu"
            hidden_dims: [32, 64, 128, 256, 256, 128, 64, 32]
  training_params:
    lr: 1e-3
    epochs: 200
    batch_size: 256
    max_patience: 10
    train_size: 0.8

# Baselines
dpe:
  training:
    lr: 1e-4
    batch_size: 512
    epochs: 2000
    train_size: 0.8
  density_estimator: 'nsf'
  params:
    embedding_net: {}
    npe_params:
      transforms: 5
      hidden_features: [64, 64]
      bins: 8

rope:
  config:
    tau: 1.0
    gamma: 1.0
  training_params:
    lr: 1e-5
    epochs: 20
    batch_size: 100
    train_size: 0.8
    rescale: ${task.rescale}
