# Task-specific "small" variant for wind_tunnel
#
# Uses smaller cfnet architecture to reduce overfitting on low-data calibration.
# Original: hidden_dims_x=[32,64,128,256,256,128,64,32], hidden_dims_theta=[32,64,128,256,128,64,32]
# Small:    hidden_dims_x=[16,32,32,16], hidden_dims_theta=[16,32,16]

_base: fm_pt_small  # Inherit training params from global variant

# Override model architecture for this task
config:
  npe: fmpe
  flow_theta:
    space: "data"
    conditional: True
    probability_path: "ot2"
    prior: 'uniform'
    base_dist: 'gaussian'
    params:
      probability_path_params: {"sigma_min": 1e-4}
      base_dist_params: {}
      drift:
        architecture: "cfnet"
        posterior_kwargs:
          input_dim: 1  # theta_dim
          dropout: 0.0
          batch_norm: False
          context_dim: 10
          theta_with_glu: True
          context_with_glu: False
          activation: "gelu"
          hidden_dims: [16, 32, 16]  # Small (vs [32,64,128,256,128,64,32])
        embedding_kwargs:
          name: "conv1d_light"
          output_dim: 10
          image_size: 50  # obs_dim
  flow_x:
    space: "data"
    conditional: True
    probability_path: "ot2"
    prior: 'uniform'
    base_dist: 'data_eps'
    params:
      probability_path_params: {"sigma_min": 1e-4}
      base_dist_params: {"eps": 0.5}
      drift:
        architecture: "cfnet"
        posterior_kwargs:
          input_dim: 50  # obs_dim
          dropout: 0.0
          batch_norm: True
          context_dim: 10
          theta_with_glu: True
          context_with_glu: False
          activation: "gelu"
          hidden_dims: [16, 32, 32, 16]  # Small (vs [32,64,128,256,256,128,64,32])
        theta_embedding_kwargs:
          name: "conv1d_light"
          time_embedding: True
          output_dim: 10
          image_size: 50  # obs_dim
          n_freqs: 3
        embedding_kwargs:
          name: "conv1d_light"
          output_dim: 10
          image_size: 50  # obs_dim
