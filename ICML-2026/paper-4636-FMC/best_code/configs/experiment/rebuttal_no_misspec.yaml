# @package _global_
# Rebuttal Experiment 1: No-Misspecification Sanity Check
#
# Verifies FMCPE degrades gracefully to NPE when there is no misspecification
# (C=I, d=0, Σ_noise≈0). Addresses Reviewers Qmdc and xKrR (Point 5).
#
# Usage:
#   python run_benchmark.py command=train_foundation +experiment=rebuttal_no_misspec
#   python run_benchmark.py command=train_variant variant_name=fm_pt_base +experiment=rebuttal_no_misspec
#   python run_benchmark.py command=evaluate +experiment=rebuttal_no_misspec
#   python run_benchmark.py command=aggregate +experiment=rebuttal_no_misspec

defaults:
  - /experiment/_profiles/development
  - _self_

experiment:
  name: "rebuttal_no_misspec"
  description: "No-misspecification sanity check: FMCPE should match NPE when y≈x"
  tags: ["rebuttal", "sanity", "no_misspecification"]
  author: "pruhlman"

data:
  n_pool: 2000
  n_test: 3000
  calibration_sizes: [10, 50, 200, 1000]
  n_sim: 50000
  seed: 42

tasks:
  - no_misspec_gaussian

foundation:
  simulation_models: ["npe", "fmpe"]
  baselines: ["dpe", "mf_npe", "rope"]

seeds: [33, 43, 53]

skip_existing: true

evaluation:
  enabled: true
  metrics: ["joint_mmd", "joint_wasserstein", "lpp", "joint_coverage"]
  conditional_metrics: ["cond_c2st", "cond_mmd", "cond_wasserstein"]
  conditional_tasks: ["no_misspec_gaussian"]
  num_joint_samples: 3000
  num_conditional_obs: 5
  num_posterior_samples: 2000
  batch_size: 1000
  skip_existing: true

results_dir: "results"

hpo:
  enabled: false

sweep:
  enabled: false

method_overrides:
  fm_post_transform:
    max_patience: null
  fm_post_transform_only_ut:
    max_patience: null

task_overrides:
  rescale: "none"
