[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofocus-cen"
version = "0.1.0"
description = "CEN autofocus for spike-frame sequences."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

