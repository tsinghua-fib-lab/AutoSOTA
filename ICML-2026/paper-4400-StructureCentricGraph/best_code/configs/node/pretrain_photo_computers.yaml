seed: 42
device: auto
data_root: data
output_dir: outputs/node_pretrain
data:
  datasets: [photo, computers]
  drop_node_features: true
model:
  K: 16
  M: 32
  feature_dim: 50
  tau: 0.3
  lambda_gw: 1.0
  lambda_recon: 2.0
  lambda_div: 0.05
  div_margin: 10.0
  num_projections: 50
train:
  epochs: 60
  batch_size: 32
  num_workers: 0
  lr: 0.01
  use_amp: true
  accumulation_steps: 1
  log_interval: 20
