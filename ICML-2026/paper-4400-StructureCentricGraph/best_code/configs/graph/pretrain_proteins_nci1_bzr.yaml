seed: 42
device: auto
data_root: data
output_dir: outputs/graph_pretrain
data:
  datasets: [PROTEINS, NCI1, BZR]
  max_nodes: 100
  use_node_attr: true
  drop_node_features: true
model:
  K: 16
  M: 32
  feature_dim: 50
  tau: 0.1
  lambda_gw: 1.0
  lambda_recon: 1.0
  lambda_div: 0.02
  div_margin: 8.0
  num_projections: 50
train:
  epochs: 60
  batch_size: 64
  num_workers: 0
  lr: 0.02
  use_amp: true
  accumulation_steps: 1
  log_interval: 20
