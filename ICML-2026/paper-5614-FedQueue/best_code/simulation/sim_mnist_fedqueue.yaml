log_configs:
  logging_output_dirname: "./output"
  logging_output_filename: "result"
  client_logging_output_filename: ""

data_configs:
  dataset_name: "MNIST"
  dataset_backend: "torchvision"
  data_dir: "/datasets"
  download: False
  partition: "dirichlet"
  partition_kwargs:
    data_seed: 42
    test_size: 0.2
    dirichlet_alpha: 0.5
    dirichlet_min_size: 2

model_configs:
  model_path: "./cnn.py"
  model_name: "CNN"
  model_kwargs:
    num_channel: 1
    num_pixel: 28
    num_classes: 10

algorithm_configs:
  device: "cuda:0"
  num_global_epochs: 50

  scheduler: "QueueScheduler"
  scheduler_kwargs:
    same_init_model: True
    num_clients: 4
    num_clients_per_round: 4
    t_sync: 10.0
    lr_base: 0.003
    warm_up_steps: 10
    alpha_queue: 0.5
    alpha_compute: 0.5
    safety_buffer: 2.0
    admission_tolerance: 100.0
    alpha_admission: 100.0
    simulate_queue: True
    queue_mode: "lognormal"
    queue_means: "0.9"
    queue_sigma: 0.4
    queue_seed: 42
    log_fedqueue_metrics: True
    fedqueue_log_dir: "./output"

  aggregator: "FedQueueAggregator"
  aggregator_kwargs:
    client_weights_mode: "sample_size"
    staleness_fn: "harmonic"
    staleness_fn_kwargs:
      beta: 0.5

  trainer: "VanillaTrainer"
  trainer_kwargs:
    mode: "step"
    num_local_steps: 10
    optim: "Adam"
    optim_args:
      lr: 0.003

    train_batch_size: 64
    val_batch_size: 64
    train_data_shuffle: True
    val_data_shuffle: False

    do_validation: True
    do_pre_validation: False
    metric_path: "./acc.py"
    metric_name: "accuracy"

    loss_fn_path: "./celoss.py"
    loss_fn_name: "CELoss"
