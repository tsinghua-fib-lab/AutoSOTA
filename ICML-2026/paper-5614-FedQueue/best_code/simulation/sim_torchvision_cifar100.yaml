log_configs:
  logging_output_dirname: "./log"
  logging_output_filename: "result"
  client_logging_output_filename: ""

data_configs:
  dataset_name: "CIFAR100"
  dataset_backend: "torchvision"
  data_dir: "./data"
  download: True
  partition: "pathological"
  partition_kwargs:
    data_seed: 42
    test_size: 0.1
    pathological_min_classes: 2

model_configs:
  model_path: "./cnn.py"
  model_name: "CNN"
  model_kwargs:
    num_channel: 3
    num_pixel: 32
    num_classes: 100

algorithm_configs:
  device: "cuda"
  num_global_epochs: 5

  scheduler: "SyncScheduler"
  scheduler_kwargs:
    same_init_model: True
    num_clients: 100
    num_clients_per_round: 5

  aggregator: "FedAvgAggregator"
  aggregator_kwargs:
    client_weights_mode: "sample_size"

  trainer: "VanillaTrainer"
  trainer_kwargs:
    mode: "step"
    num_local_steps: 100
    optim: "SGD"
    optim_args:
      lr: 0.01
      momentum: 0.9
      weight_decay: 5e-4

    # Data loader
    train_batch_size: 64
    val_batch_size: 64
    train_data_shuffle: True
    val_data_shuffle: False

    # Client validation
    do_validation: True
    do_pre_validation: True
    metric_path: "./acc.py"
    metric_name: "accuracy"

    # Loss function
    loss_fn_path: "./celoss.py"
    loss_fn_name: "CELoss"
