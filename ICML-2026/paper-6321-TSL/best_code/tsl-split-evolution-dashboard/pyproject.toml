[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tslviz"
version = "0.1.0"
description = "Browser-based visualizer for TSL split-event logs (FastAPI backend, D3.js frontend)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jinyang Liu", email = "jl@math.ku.dk" }]
keywords = ["tsl", "visualization", "dashboard", "d3js", "fastapi", "interpretable-ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "orjson>=3.9,<4.0",
]

[project.urls]
Homepage = "https://github.com/jyliuu/TSL"
Repository = "https://github.com/jyliuu/TSL"
Issues = "https://github.com/jyliuu/TSL/issues"

[project.scripts]
tslviz = "tslviz.backend.app:main"

[tool.setuptools]
packages = ["tslviz", "tslviz.backend"]
package-dir = { "tslviz" = "." }

[tool.setuptools.package-data]
"tslviz" = [
    "frontend/**/*.html",
    "frontend/**/*.js",
    "frontend/**/*.css",
]
