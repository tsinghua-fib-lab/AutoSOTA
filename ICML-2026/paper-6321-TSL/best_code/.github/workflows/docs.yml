name: Docs

# Builds the MkDocs site in strict mode (`--strict` turns broken internal links
# and bad nav entries into errors) and, on `main`, deploys it to GitHub Pages via
# the official Pages actions. Pull requests run the build only — the deploy job is
# gated to the `main` ref, so PRs stay a pure correctness gate with no publish.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Token scopes required by actions/deploy-pages (OIDC + Pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs on the same ref; the latest docs always win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict -f docs/mkdocs.yml

      # site_dir defaults to docs/site (relative to docs/mkdocs.yml).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy to GitHub Pages
    # Publish only from main (push or dispatch-from-main); PRs build but never deploy.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
