name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which part of the tree changed so the suites below run only when
  # relevant. Python wraps Rust, so a Rust change runs both suites; a
  # Python-only change runs just the Python suite.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            python:
              - 'tsl-py/**'
              - '!tsl-py/examples/**'
              - '.github/workflows/ci.yml'

  rust-tests:
    name: Rust tests
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Scope to the core library crate: it owns every integration test under
      # tests/. The tsl-py crate is a pyo3 `extension-module` cdylib whose test
      # harness cannot link libpython on Linux; it is covered by the Python job.
      - name: Run tests
        run: cargo test -p tsl_rust --release

  python-tests:
    name: Python tests
    needs: changes
    # Python wraps Rust, so a Rust change must also exercise the Python suite.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tsl-py/pyproject.toml

      # Build the extension as a release wheel (numerical workload) and install
      # it natively with the declared `test` extra (pytest). No venv needed —
      # the job runs in a throwaway container, so the runner's Python is fine.
      # A plain `pip install` can't build in release (maturin rejects --release
      # in its PEP517 metadata step), so we build the wheel explicitly.
      - name: Build release wheel
        working-directory: tsl-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --interpreter python --out dist

      - name: Install wheel and test deps
        working-directory: tsl-py
        run: pip install "$(ls dist/*.whl)[test]"

      - name: Run tests
        working-directory: tsl-py
        run: pytest python/tests/

  version-alignment:
    name: Version alignment
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `cargo metadata` resolves the workspace version; it parses manifests
      # only, no compile.
      - uses: dtolnay/rust-toolchain@stable

      # Asserts the R package version tracks the canonical Cargo version. While
      # the R package does not exist yet this is a clean no-op.
      - name: Check version alignment
        run: python3 scripts/sync-version.py --check

  r-tests:
    name: R tests
    runs-on: ubuntu-latest
    env:
      # Not a CRAN build: the core is fetched as a git dependency rather than
      # from a vendored tarball, so cargo needs network access (no --offline).
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tsl-r/src/rust

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: tsl-r
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: tsl-r
          upload-snapshots: true
          args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
