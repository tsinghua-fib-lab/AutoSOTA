# Dependabot keeps dependencies and pinned GitHub Actions current. Updates are
# grouped and weekly to keep PR volume low, and use Conventional Commit prefixes
# (ci / build) that the changelog config (cliff.toml) leaves out.
version: 2
updates:
  # GitHub Actions pinned in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Rust crates across the Cargo workspace (core + tsl-py). Minor/patch bumps are
  # batched; majors get their own PR for review.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: ["minor", "patch"]

  # MkDocs documentation toolchain.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docs:
        patterns: ["*"]

  # Split-evolution dashboard (tslviz) Python app.
  - package-ecosystem: pip
    directory: /tsl-split-evolution-dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dashboard:
        patterns: ["*"]
