method: grid
parameters:
  policy.params.smc.kwargs.value.num_particles:
    values: [ 4, 8, 16 ]
  policy.params.smc.kwargs.value.depth:
    values: [ 4, 32, 64 ]

  policy.params.smc.kwargs.value.resampling_period:
    values: [ 3, 15, 1000 ]

  policy.params.smc.proposal_kwargs.value.constraint_param:
    values: [ 0.0, 0.3 ]

  policy.params.smc.target_kwargs.value.temperature:
    values: [0.1, 1.0]
