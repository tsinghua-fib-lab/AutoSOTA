data_generator:
  batch_size:
    desc: Number of environments/ agents to run in parallel
    value: 128
  desc: 'Namespace for configuring agent-environment interaction. This generates data
    for training in chunks of size (batch_size x length). The total number of samples
    is then calculated by `batch_size * length * experiment.max_iterations`

    '
  length:
    desc: Sequence length for generating environment data
    value: 64
experiment:
  desc: Namespace for configuring experiment settings
  eager_eval:
    desc: 'Whether to immediately evaluate iterates or defer this. Setting this to
      `false` means to keep all `max_iterations // eval_period` model snapshots in
      memory to evaluate after the training loop.

      '
    value: true
  eval_period:
    desc: Evaluate each intermediate agent with this period
    value: 125
  max_iterations:
    desc: Number of learning iterations to perform
    value: 1250
  name:
    desc: Name of this experiment configuration
    value: Jumanji
  snapshot_period:
    desc: Save model weights (and eval-metrics if compatible) with this period.
    value: 1250
rng:
  desc: Namespace for configuring pseudo-randomness initialization
  seed:
    desc: Initialization values to pseudo-random number generators
    value: 0
