policy:
  desc: Namespace for configuring the agent-policy for data-generation.
  method:
    desc: Agent name/ specification for the factory.
    value: smc
  params:
    desc: Hyperparameters namespace for the `smc` RL-policy implementation
    option:
      desc: >
        Choice between `dirac`, `value`, or `sumprod` to change construction
        of the behaviour policy + learning targets.
      value: trace
    value_mixing:
      desc: >
        Linear mixing parameter for prior and posterior estimated value, to be used
        for bootstrapping values in credit-assignment (0 = prior, 1 = posterior).
      value: 0.5
    stochastic_eval:
      desc: >
        If true, use sampling from PMF for selecting actions at offline testing. 
        Otherwise, select the max-logit (or mean if Gaussian; i.e., deterministic).
      value: false
    credit_assignment: { discount: 0.99, td_lambda: 0.9 }
    smc:
      desc: Hyperparameter configuration for our (iterated) particle filter planning method
      kwargs:
        desc: Base SMC hyperparameters
        value: {
          depth: 4,
          num_particles: 4,
          resampling_period: 3,
          prevent_particle_death: true
        }

      proposal_kwargs:
        desc: Hyperparameters for the (twisted) proposal distribution
        value: {
          bootstrap: 30,
          constraint_param: .1,
          constraint_type: sandwich,
          method: VariationalKullbackLeibler,
          root_method: null
        }
      transition_kwargs:
        desc: Unused field for interface parity
        value: { }
      target_kwargs:
        desc: Target policy improvement operator keyword arguments
        value: { normalizer: softmax, temperature: .1 }
