# Metric Runner Configuration
# This file defines parameter combinations for running gen_metric.py
# Device Priority System (for CUDA):
# - Jobs requiring 1-2 GPUs: Highest priority (runs first)
# - Jobs requiring 3+ GPUs: Medium priority
# - Jobs requiring "all" GPUs: Lowest priority (runs last)
#
# Device Management:
# - CUDA: GPU allocation with priority-based queue management
# - MPS: Sequential execution (one job at a time)
# - CPU: Parallel execution with configurable max_concurrency
#
# Model Configuration Format:
# embedding_model:
#   - [model_name, embedding_type, model_suffix]  # For local models
#   - [model_name, null, model_suffix]            # For API models (OpenAI, Gemini) where pooling is ignored
#
# Examples:
# embedding_model:
#   - ["microsoft/mdeberta-v3-base", "mean", "mdeberta_v3_base"]      # Local model with mean pooling
#   - ["microsoft/mdeberta-v3-base", "last", "mdeberta_v3_base"]      # Same model with last token pooling
#   - ["text-embedding-3-small", null, "openai_v3_small"]            # OpenAI API model (pooling ignored)
#   - ["models/text-embedding-004", null, "gemini_004"]              # Gemini API model (pooling ignored)
#
# Device Configuration Format:
# devices:
#   default:
#     type: "cuda"|"mps"|"cpu"        # Device type
#     count: <integer or "all">       # For CUDA: number of GPUs
#     max_concurrency: <integer>      # For CPU: max concurrent jobs
#   overrides:                        # Optional: Override device config for specific parameter combinations
#     - condition:                    # Parameters that must match for this override to apply
#         embedding_model: "model_name"  # Note: Use model name only, not the tuple
#         response_count: 1000
#       value:
#         type: "cuda"|"mps"|"cpu"
#         count: <integer or "all">   # Only relevant for CUDA
#         max_concurrency: <integer>  # Only relevant for CPU
#
# Legacy GPU format (still supported for backward compatibility):
# num_devices: 1      # Simple integer - all combinations use this many GPUs
# num_devices: "all"  # All combinations need all GPUs
#
# Root Directory Substitution:
# Set root_directory at the top level, then use {{root_dir}} in any path
# Examples:
#   root_directory: "/data/experiments"
#   input_path: "{{root_dir}}/datasets/responses.json"
#   output_dir: "{{root_dir}}/results"
#   script_path: "{{root_dir}}/scripts/gen_metric.py"
#
# Paths without {{root_dir}} are used as-is (absolute or relative to working directory)
###############


root_directory: "/path/to/dir/data/experiments/semantic_isotropy"
code_directory: "/path/to/dir/git/semantic_isotropy"
script_path: "{{code_dir}}/scripts/segscore/gen_metric.py"
logging_directory: "{{root_dir}}/logs/metric_runner"
# Hardware configuration
available_gpus: 2  # Number of available GPUs (0, 1, 2, 3) - set this based on your hardware

runs:

  # Run 1: Isotropy metrics with different models and embedding types
  - input_path: "{{root_dir}}/oeq_sample_fsbio_10_0.7_openai_gpt-4.1-mini/seg_score_wc500_c182_k10.json"
    output_path_template: "{{root_dir}}/oeq_sample_fsbio_10_0.7_openai_gpt-4.1-mini/scored_c182_m_{{metric}}_wctrim_{{response_count}}_emb_{{model_suffix}}.pkl"
    metric: "luq"
    dryrun: false
    embedding_model:
      - ["potsawee/deberta-v3-large-mnli", "mean", "deberta-v3-l-mnli"]
    response_count:
      - 250
      - 500
    response_max: 500
    group_batch_size: 100
    dtype: "half"
    overwrite: false
    restart_from_checkpoint: true
    # Device configuration with defaults and overrides
    # Supported device types: "cuda", "mps", "cpu"
    # - cuda: Jobs run on GPUs with allocation management (1 GPU or "all" GPUs)
    # - mps: Jobs run sequentially on Apple Silicon MPS
    # - cpu: Jobs run concurrently with configurable max_concurrency
    devices:
      default:
        type: "cuda"  # Device type: "cuda", "mps", or "cpu"
        count: 1      # For CUDA: 1 GPU or "all" GPUs
        max_concurrency: 2  # For CPU: maximum concurrent jobs


  # Run 1: Isotropy metrics with different models and embedding types
  - input_path: "{{root_dir}}/oeq_sample_fsbio_10_0.7_openai_gpt-4.1-mini/seg_score_wc500_c182_k10.json"
    output_path_template: "{{root_dir}}/oeq_sample_fsbio_10_0.7_openai_gpt-4.1-mini/scored_c182_m_{{metric}}_wctrim_{{response_count}}_emb_{{model_suffix}}.pkl"
    metric: "entailment"
    dryrun: false
    embedding_model:
      - ["microsoft/deberta-v2-xlarge-mnli", "mean", "deberta-v2-xl-mnli"]
    response_count:
      - 250
      - 500
    response_max: 500
    group_batch_size: 100
    dtype: "half"
    overwrite: false
    restart_from_checkpoint: true
    devices:
      default:
        type: "cuda"  # Device type: "cuda", "mps", or "cpu"
        count: 1      # For CUDA: 1 GPU or "all" GPUs
        max_concurrency: 2  # For CPU: maximum concurrent jobs


