[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacer"
version = "0.1.0"
description = "PACER causal discovery package"
requires-python = ">=3.10"

dependencies = [
    "optax",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "networkx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]