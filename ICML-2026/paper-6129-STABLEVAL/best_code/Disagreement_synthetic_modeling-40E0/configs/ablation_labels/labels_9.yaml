# Labels per item: 9
n_agents: 6
n_items: 500
agent_qualities: [0.85, 0.80, 0.70, 0.55, 0.35, 0.20]
n_annotators: 30
labels_per_item: 9
annotator_distribution:
  normal: 18
  strict: 6
  lenient: 4
  adversarial: 2
hard_item_prob: 0.2
easy_beta_params: [2, 12]
hard_beta_params: [6, 3]
class_labels: [0, 1, 2]
credit_mapping: [0.0, 0.5, 1.0]
partial_correct_prob: 0.35
n_repetitions: 100
n_stability_subsamples: 10
subsample_labels: 3
save_raw_data: true
save_confusion_matrices: true
save_posteriors: true
output_dir: "results"
