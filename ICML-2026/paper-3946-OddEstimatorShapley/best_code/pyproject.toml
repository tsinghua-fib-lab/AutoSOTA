[project]
name = "oddshap-supplement"
version = "0.1.0"
description = "An Odd Estimator for Shapley Values"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.1.6",
    "graphviz>=0.21",
    "ipykernel>=7.1.0",
    "jupyter",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.4",
    "openpyxl>=3.1.5",
    "pytest>=8.4.2",
    "scikit-learn>=1.7.2",
    "shap>=0.49.1",
    "shapiq-benchmark",
    "tabpfn>=6.0.3",
    "torch>=2.9.0",
    "torch-geometric>=2.7.0",
    "transformers>=4.57.1",
    "xgboost>=3.1.1",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oddshap*"]

[tool.uv.workspace]
members = [
    "shapiq-benchmark",
    "shapiq_local",
]

[tool.uv.sources]
shapiq-benchmark = { workspace = true }
shapiq_local = { workspace = true }
shapiq = { workspace = true }

