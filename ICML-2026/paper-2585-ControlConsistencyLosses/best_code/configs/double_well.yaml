problem:
  name: double_well
  a_sq: 1.0
  v: 3.0
  sigma: 1.0
  d: 1
  T: 1.0

model:
  type: conservative
  dim_hidden: [128, 128]
  emb_dim_hidden: [64, 64]
  activation: gelu

bridge:
  base_drift: false
  guiding_type: brownian
  decay_coeff: false
  sampler: euler

train:
  self_consistency: nodrift
  num_steps: 500
  num_outer_iterations: 4000
  num_inner_iterations: 1
  traj_batch_size: 64
  train_batch_size: 20000 # 4096
  lr: 1.0e-3
  ema_rate: 1.0
  grad_ema_rate: 1.0
  jacobian_method: euler
  beta_schedule: average
  B_ratio: 0.9
  ckpt_freq: 200
  STL_adjustments: false
  seed: 0

plotting:
  plot_fn: plot_trajectories_1d