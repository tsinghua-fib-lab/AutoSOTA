        <script type="text/javascript">

        function searchNode() {
    var input = document.getElementById('searchBox').value;
    var options = {
        scale: 10,
        offset: {x:0, y:0},
        animation: {
          duration: 1000,
          easingFunction: "easeInOutQuad"
        }
    };
    // Wait for the network to be initialized
    setTimeout(function() {
        var network = window.network; // Assuming 'network' is the global variable that pyvis sets for the network instance
        if(network) {
            var nodeIds = network.body.data.nodes.getIds();
            var nodeId = nodeIds.find(id => network.body.data.nodes.get(id).label === input);
            if (nodeId) {
                network.focus(nodeId, options);
                network.selectNodes([nodeId]);
                network.body.data.nodes.update({id: nodeId, color: {background: 'red'}});
            } else {
                alert('Node not found!');
            }
        } else {
            alert('Network not initialized.');
        }
    }, 1000); // Delay may need to be adjusted depending on how long the network takes to load
}
