[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m-design"
version = "0.1.0"
description = "Official implementation of M-DESIGN for fine-grained neural network design."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jialiang Wang", email = "jilwang804@gmail.com"}
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "torch-scatter>=2.1",
    "torch-sparse>=0.6",
    "torch-cluster>=1.6",
    "torch-spline-conv>=1.2",
    "deepsnap>=0.2.1",
    "tensorboardX>=2.6",
    "pytorch-lightning>=2.1",
    "python-louvain>=0.16",
    "yacs>=0.1.8",
    "ogb>=1.3.6",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
]
hf = [
    "huggingface_hub>=0.23",
    "hf-xet>=1.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = [".", "GraphGym"]
include = ["graph_comparison*", "graph_understanding*", "knowledge_retrieval*", "model_refinement*", "graphgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
