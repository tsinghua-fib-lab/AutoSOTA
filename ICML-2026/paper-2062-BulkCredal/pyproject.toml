[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "credal_dro"
authors = []
description = "DRO with Credal Ambiguity Sets"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Distributionally Robust Optimisation", "Imprecise Probability"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "joblib>=1.3.2",
    "numpy>=1.26.2",
    "pandas>=2.1.4",
    "scikit_learn>=1.3.2",
    "scipy>=1.11.4",
    "tqdm>=4.66.1",
    "typer>=0.9.0",
    "jax>=0.4.23",
    "jaxlib>=0.4.23",
    "pot>=0.9.1",
    "cvxpy>=1.4.2",
    "openpyxl>=3.1.5",
    "seaborn>=0.13.2",
    "ipykernel>=7.1.0"
]
dynamic = ["version"]

[tool.setuptools]
packages = ["bayesian_dro", "credal_dro","credal_dro.wilds"]

[project.scripts]
credaldro = "credal_dro.main:app"

[project.optional-dependencies]
# Optional dependencies for the real-world robustness suite (PyTorch datasets + training).

wilds = [
    # Core training
    "torch>=2.0",
    "torchvision>=0.15",

    # Group-labelled benchmarks via WILDS (CivilComments)
    "wilds>=2.0.0",
]
