[experiment_config]
model_type = "gru"
dataset_name = "simple_rbergomi"

# Optimizer
optimizer = "muon"
learning_rate = 5e-3
weight_decay = 0.000001
max_grad_norm = 1.0

# Training
loss = "sigker"
seed = 1
batch_size = 512
epochs = 100
early_stopping_patience = 25

# Training mode
training_mode = "unconditional"
# Unconditional generation samples a Brownian motion with this many channels.

manifold = "euclidean"
hidden_state_mode = "euclidean"
evolving_out = true

[solver_config]
stepsize_controller = "pid"
solver = "heun"
rtol = 1e-3
atol = 1e-3
dtmin = 1e-4

[gru_config]

# GRU model parameters
gru_state_dim = 32
init_hidden_dim = 32
initial_cond_mlp_depth = 2
out_size = 1
