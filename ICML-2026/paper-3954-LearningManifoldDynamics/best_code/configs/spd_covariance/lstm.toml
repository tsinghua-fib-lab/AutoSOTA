[experiment_config]
model_type = "lstm"
dataset_name = "spd_wishart_diffusion"

# Optimizer
optimizer = "muon"
learning_rate = 5e-3
weight_decay = 0.000001
max_grad_norm = 1.0

# Training
loss = "sigker"
seed = 1
batch_size = 32
epochs = 16
early_stopping_patience = 3

# Training mode
training_mode = "unconditional"

manifold = "euclidean"
hidden_state_mode = "euclidean"
evolving_out = true

[solver_config]
stepsize_controller = "pid"
solver = "heun"
rtol = 1e-3
atol = 1e-3
dtmin = 1e-4

[lstm_config]
lstm_state_dim = 32
num_layers = 2
init_hidden_dim = 32
initial_cond_mlp_depth = 2
out_size = 6
