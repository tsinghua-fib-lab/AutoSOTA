[experiment_config]
model_type = "xlstm"
dataset_name = "simple_rbergomi"

# Optimizer
optimizer = "muon"
learning_rate = 5e-3
weight_decay = 0.000001
max_grad_norm = 1.0

# Training
loss = "sigker"
seed = 1
batch_size = 512
epochs = 100

# Training mode
training_mode = "unconditional"
# Unconditional generation samples a Brownian motion with this many channels.

manifold = "euclidean"
hidden_state_mode = "euclidean"
evolving_out = true

[solver_config]
stepsize_controller = "pid"
solver = "tsit5"
rtol = 1e-3
atol = 1e-3
dtmin = 1e-4

[xlstm_config]

# GRU model parameters
d_model = 32
num_heads = 4
d_conv = 4
xlstm_expand = 2
ffn_expand = 2
use_ffn = true
out_size = 1
