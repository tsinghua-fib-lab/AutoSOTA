[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name            = "aporia"
version         = "1.0.0"
description     = "Geometric analysis of small-sized LLM hallucinations (ICML 2026)."
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "CC-BY-NC-SA-4.0" }

authors = [
    { name = "Emanuele Ricco" },
    { name = "Elia Onofri",   email = "elia.onofri@kaust.edu.sa" },
    { name = "Lorenzo Cima" },
    { name = "Stefano Cresci" },
    { name = "Roberto Di Pietro" },
]

keywords = [
    "hallucination detection",
    "large language models",
    "sentence embeddings",
    "Fisher discriminant",
    "label propagation",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",     # parquet I/O
    "tqdm>=4.65",
]

[project.optional-dependencies]
umap     = ["umap-learn>=0.5"]
notebook = ["jupyter", "matplotlib>=3.7", "networkx>=3.0", "tabulate>=0.9"]
dev      = ["pytest>=7.0", "ruff>=0.1"]


[project.urls]
Repository = "https://github.com/eOnofri04/aporia"
Dataset    = "https://doi.org/"


# ----- setuptools config -----

[tool.setuptools]
packages = ["aporia"]
