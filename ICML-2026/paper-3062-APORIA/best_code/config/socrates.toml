# =====================================================================
# Configuration for the SOCRATES-300K dataset.
#
# Used by every notebook to make experiments dataset-agnostic.
# =====================================================================

[dataset]
name                     = "SOCRATES-300K"
path                     = "datasets/SOCRATES-300K.parquet"
embedding_column         = "response_embeddings"
label_column             = "hallucination"
prompt_column            = "prompt_id"
model_column             = "model_id"
unify_years              = true             # collapse 2020/2022 onto prompt_id axis
max_responses_per_prompt = 150

# Alternative embedding column for the stemmed-responses ablation:
#   embedding_column = "stemmed_response_embeddings"


[experiment]
best_lambda    = 1.2
n_permutations = 100
random_state   = 42
min_per_class  = 5


[cache]
root    = "cache/socrates"
fig_dir = "figs/socrates"


