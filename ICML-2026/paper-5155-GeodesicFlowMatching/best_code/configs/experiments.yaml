# Legacy multi-run driver: ``python cleanup_ssps/main.py``
# Prefer the single-file pipeline: ``configs/config.yaml`` + ``python -m src.main``.

experiments:
  - name: default_experiment
    tags: [dev]
    ssp_config:
      bundle_type: hexagonal
      n_rotates: 4
      n_scales: 4
      length_scale: 0.2
      domain_dim: 2
      domain_bounds: [[-1, 1], [-1, 1]]
    trainer_config:
      data_root: data
      target_dataset_type: coordinate_ssps
      train_samples: 20000
      test_samples: 5000
      dataset_sampling_method: sobol
      train_subdir: train
      test_subdir: test
      sampling_modes:
        - geo_det
      device: cuda
      batch_size: 256
      epochs: 100
      lr: 1.0e-4
      weight_decay: 1.0e-4
      val_split: 0.1
      noise_type: uniform_hypersphere
      target_type: coordinate
      signal_strength: 0.0
      sigma_min: 0.1
      beta_min: 0.1
      beta_max: 20.0
      ot_method: sinkhorn
      ot_reg: 0.005
      ot_reg_sb: 0.05
      train_feedforward: false
      dataloader_num_workers: 0
      dataloader_prefetch_factor: 2
    eval_config:
      signal_strengths: [0.0, 0.25, 0.5, 0.75, 1.0]
      num_steps: [1, 2, 5, 10, 50]
      repeats: 5
