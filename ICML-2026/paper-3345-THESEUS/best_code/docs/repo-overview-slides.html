<li>merging or transporting those deltas,</li>
<li>evaluating the result on shared suites.</li>
</ol>
</section>

<h1 id="the-big-mental-model"><strong>The Big Mental Model</strong></h1>
<p>Three verbs explain almost everything:</p>
<ul>
<li><code>finetune/</code>: create task-specific checkpoints</li>
<li><code>merge/</code> and <code>rebase/</code>: transform updates</li>
<li><code>eval/</code>: run experiments and report metrics</li>
</ul>
<p>If you keep those three buckets in mind, the folder structure makes sense quickly.</p>

<h1 id="what-uv-is"><strong>What <code>uv</code> Is</strong></h1>
<p><code>uv</code> is a fast Python packaging toolchain.</p>
<p>In practice, it combines the jobs people often split across:</p>
<ul>
<li><code>python -m venv</code></li>
<li><code>pip</code></li>
<li>lockfile management</li>
<li>one-shot run commands</li>
</ul>
<p>So in this repo, <code>uv</code> is the default way to create the environment and install the package.</p>
</section>

<h1 id="uv-vs-conda"><strong><code>uv</code> Vs <code>conda</code></strong></h1>
<p>A useful mental model is:</p>
<ul>
<li><code>conda</code> manages environments plus many non-Python binaries and system-style dependencies</li>
<li><code>uv</code> is focused on Python packaging, virtualenvs, and <code>pip</code>-style installs</li>
</ul>
<p>So <code>uv</code> feels closer to:</p>
<ul>
<li><code>venv</code> + <code>pip</code>, but faster and more integrated</li>
</ul>
</section>

<p>A common workflow looks like this:</p>
<ol>
<li>fine-tune one checkpoint per task</li>
<li>load those checkpoints together</li>
<li>convert them into task vectors</li>
<li>merge them with a chosen method</li>
<li>evaluate the merged model on the suite</li>
</ol>
</section>

<p>Small version of what <code>train_vision.py</code> does:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cfg_file = _load_config(args.vision_config)

<span class="hljs-keyword">for</span> task <span class="hljs-keyword">in</span> tasks:
    summary = train_task(
        task=task,
        build_cfg=build_cfg,
        strategy=strategy,
        ...,
    )
</code></pre>
<p>This is why the repo feels config-driven: the outer script mostly resolves config, then loops through tasks.</p>

<ol>

<li>choose a training strategy</li>
<li>train and validate</li>
<li>save checkpoint + JSON summary</li>
</ol>

<h1 id="vision-strategies"><strong>Vision Strategies</strong></h1>
<p>Built-in vision strategies:</p>
<ul>
<li><code>full</code>: train all parameters</li>
<li><code>linear_probe</code>: train only the classification head</li>

</ul>

<ul>

<h1 id="merge-code-snippet"><strong>Merge Code Snippet</strong></h1>
<p>The core pattern looks like this:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">method = get_method(cfg[<span class="hljs-string">&quot;method&quot;</span>])
prepared = method.prepare(
    base=base_sd,
    tuned=tuned_sds_list,
    weights=weights,
)
merged_sd = method.apply(prepared=prepared, alpha=alpha)
</code></pre>
<p>That <code>prepare -&gt; apply</code> split is what makes alpha search cheap.</p>
</section>

<h1 id="alpha-search"><strong>Alpha Search</strong></h1>
<p>Instead of assuming the merge scale should be <code>1.0</code>, the repo can scan a range.</p>
<p>Example:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">alpha in {0.0, 0.1, 0.2, ..., 2.0}
</code></pre>
<p>This is useful because many merge methods produce the best accuracy at a non-default scale.</p>

<h1 id="text-feature-example"><strong>Text Feature Example</strong></h1>
<p>If a checkpoint contains tuned text features:</p>
<ul>
<li><code>auto</code> uses them</li>
<li><code>tuned_ckpt</code> requires them</li>
<li><code>zero_shot</code> ignores them and rebuilds from templates</li>
</ul>
<p>This matters because a merged vision model may pair better with either tuned or zero-shot text embeddings.</p>

<h1 id="method-example-ties"><strong>Method Example: TIES</strong></h1>
<p>TIES roughly does:</p>
<ol>
<li>prune small entries</li>
<li>resolve signs across tasks</li>
<li>merge only sign-consistent entries</li>
</ol>
<p>That makes it less naive than pure summation when task deltas conflict.</p>

<h1 id="subspace-example-intuition"><strong>Subspace Example Intuition</strong></h1>

<p>With a subspace, you instead do:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">adapter updates -&gt; project -&gt; merge in low-rank space -&gt; lift back
</code></pre>
<p>That is why <code>core_space.py</code> and <code>knots_space.py</code> matter.</p>
</section>

<h1 id="rebase-code-snippet"><strong>Rebase Code Snippet</strong></h1>
<p>Conceptually, the rebase path looks like this:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">deltas = [TaskVector.from_checkpoints(source_base, tuned).delta <span class="hljs-keyword">for</span> tuned <span class="hljs-keyword">in</span> tuned_sds]
merged_delta = compose_weighted_deltas(deltas, weights)

transport = GradFixRebase()
prepared = transport.prepare(
    target_model=target_model,
    target_dataloader=grad_loader,
    recipe=clip_contrastive_recipe(...),
)
rebased_delta = transport.apply(prepared, delta=merged_delta)
</code></pre>
<p>The important idea is: merge first, then transport the merged delta.</p>
</section>

<h1 id="what-rebase-means"><strong>What Rebase Means</strong></h1>
<p>Normal merge says:</p>
<ul>
<li>combine updates around one base model</li>
</ul>
<p>Rebase says:</p>
<ul>
<li>take an update defined around base A</li>
<li>transport it so it can be applied to base B</li>
</ul>
<p>That is the role of <code>rebase/</code>.</p>
</section>

<h1 id="gradfix-in-plain-english"><strong>GradFix In Plain English</strong></h1>
<p>GradFix asks:</p>
<ul>
<li>when we evaluate on the target model, which parameter directions seem helpful?</li>
</ul>
<p>Then it:</p>
<ul>
<li>computes gradient signs on target data</li>
<li>compares those signs to the transported delta</li>
<li>keeps or forces entries based on agreement</li>
</ul>
</section>

<h1 id="gradfix-example"><strong>GradFix Example</strong></h1>
<p>Imagine one transported delta entry is <code>-0.4</code>.</p>
<p>If GradFix says the target gradient sign prefers negative movement too:</p>
<ul>
<li>keep it in <code>normal</code> mode</li>
</ul>
<p>If the signs disagree:</p>
<ul>
<li>zero it out in <code>normal</code></li>
<li>or flip/force it in <code>force</code></li>
</ul>
</section>

<ul>

<li>which parameters to track</li>

<ul>
<li><code>clip_contrastive_recipe</code></li>
<li><code>causal_lm_recipe</code></li>

</ul>

<ul>

<li>helps evaluation match the intended linearized training regime</li>
</ul>
<p>Core helper:</p>
<ul>
<li><code>utils/linearization.py</code></li>
</ul>
</section>

<p>Small version of the text runner loop:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cfg_file = _load_config(args.text_config)
tasks = resolve_tasks(args, cfg_file)

<span class="hljs-keyword">for</span> task <span class="hljs-keyword">in</span> tasks:
    summary, head = train_task(
        task=task,
        build_cfg=build_cfg,
        strategy=strategy,
        ...,
    )
</code></pre>
<p>It mirrors <code>train_vision.py</code>, but on tokenized NLI data and HF text models.</p>

<h1 id="what-train_textpy-does"><strong>What <code>train_text.py</code> Does</strong></h1>
<p>It roughly:</p>
<ol>
<li>loads the HF text model</li>
<li>loads tokenized NLI data</li>
<li>applies a strategy</li>
<li>trains per task</li>
<li>saves checkpoints and extracted task heads</li>
</ol>
<p>Supported text strategies:</p>
<ul>
<li><code>full</code></li>
<li><code>linear_probe</code></li>
<li><code>peft_lora</code></li>
</ul>
</section>

<h1 id="how-the-registry-pattern-works"><strong>How The Registry Pattern Works</strong></h1>
<p>This repo uses a lightweight plugin pattern.</p>
<p>The idea is:</p>
<ol>
<li>define a protocol such as <code>MergeMethod</code> or <code>Strategy</code></li>
<li>keep a global dictionary keyed by <code>name</code></li>
<li>expose <code>register(...)</code>, <code>get_* (...)</code>, and <code>list_* (...)</code></li>
<li>import implementation modules so they register themselves</li>
</ol>
<p>That is how new components become visible to the entrypoints.</p>
</section>

<h1 id="registry-example-merge-methods"><strong>Registry Example: Merge Methods</strong></h1>
<p>The merge registry is essentially:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">_METHODS: <span class="hljs-built_in">dict</span>[<span class="hljs-built_in">str</span>, MergeMethod] = {}

<span class="hljs-keyword">def</span> <span class="hljs-title function_">register</span>(<span class="hljs-params">method</span>):
    _METHODS[method.name] = method

<span class="hljs-keyword">def</span> <span class="hljs-title function_">get_method</span>(<span class="hljs-params">name</span>):
    <span class="hljs-keyword">return</span> _METHODS[name]
</code></pre>
<p>Then each method module ends with something like:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">register(TaskArithmeticMerge())
</code></pre>
</section>

<h1 id="why-this-design-is-nice"><strong>Why This Design Is Nice</strong></h1>
<p>Why use registries instead of giant <code>if/elif</code> trees?</p>
<ul>
<li>entrypoints stay small</li>
<li>implementations live next to their own logic</li>
<li>CLI/config can refer to components by name</li>
<li>adding a component usually means adding one new file, not editing many call sites</li>
</ul>
</section>

<h1 id="extension-points-in-this-repo"><strong>Extension Points In This Repo</strong></h1>
<p>The main plugin-style families are:</p>
<ul>
<li>merge methods</li>
<li>rebase methods</li>
<li>finetuning strategies</li>
<li>PEFT subspaces</li>
<li>regularizers</li>
</ul>
<p>Each family has:</p>
<ul>
<li>a base protocol</li>
<li>a registry file</li>
<li>implementation modules that call <code>register(...)</code></li>
</ul>
</section>

<h1 id="how-discovery-actually-happens"><strong>How Discovery Actually Happens</strong></h1>
<p>The important trick is side-effect import.</p>
<p>Example:</p>
<ul>
<li><code>merge/registry.py</code> imports <code>merge.methods</code></li>
<li><code>merge.methods</code> imports the concrete method files</li>
<li>each concrete file calls <code>register(...)</code></li>
</ul>
<p>So by the time <code>get_method(...)</code> is used, the registry has already been populated.</p>
</section>

<h1 id="side-effect-import-example"><strong>Side-Effect Import Example</strong></h1>
<p>The pattern looks like this:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># registry.py</span>
<span class="hljs-keyword">from</span> . <span class="hljs-keyword">import</span> methods <span class="hljs-keyword">as</span> _methods

<span class="hljs-comment"># task_arithmetic.py</span>
register(TaskArithmeticMerge())
</code></pre>
<p>The import is not used directly for values.<br />
It exists so Python executes the module and triggers registration.</p>
</section>

<h1 id="how-to-add-a-merge-method"><strong>How To Add A Merge Method</strong></h1>
<p>Steps:</p>
<ol>
<li>create a file in <code>merge/methods/</code></li>
<li>implement a class with a unique <code>name</code></li>
<li>implement <code>merge(...)</code>, or better <code>prepare(...)</code> + <code>apply(...)</code></li>
<li>call <code>register(YourMethod())</code></li>
<li>make sure the module is imported by <code>merge/methods/__init__.py</code></li>
</ol>
<p>Then the method becomes usable from config and CLI.</p>
</section>

<h1 id="merge-method-template"><strong>Merge Method Template</strong></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> dataclasses <span class="hljs-keyword">import</span> dataclass
<span class="hljs-keyword">from</span> ..base <span class="hljs-keyword">import</span> TensorDict
<span class="hljs-keyword">from</span> ..registry <span class="hljs-keyword">import</span> register

<span class="hljs-meta">@dataclass(<span class="hljs-params">frozen=<span class="hljs-literal">True</span></span>)</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">MyMerge</span>:
    name: <span class="hljs-built_in">str</span> = <span class="hljs-string">&quot;my_merge&quot;</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">merge</span>(<span class="hljs-params">self, *, base: TensorDict, tuned, weights=<span class="hljs-literal">None</span>, **kwargs</span>):
        ...

register(MyMerge())
</code></pre>
<p>If you support alpha search, add <code>prepare(...)</code> and <code>apply(...)</code> too.</p>

<h1 id="what-configure-is-responsible-for"><strong>What <code>configure(...)</code> Is Responsible For</strong></h1>
<p>A strategy owns training policy.</p>
<p>That usually means:</p>
<ul>
<li>which params are trainable</li>
<li>whether forward is patched or wrapped</li>
<li>optimizer choice</li>
<li>scheduler choice</li>
<li>reporting summary info</li>
</ul>
<p>So if you add a strategy, think “training policy module,” not just “optimizer preset.”</p>
</section>

<h1 id="checklist-when-adding-any-component"><strong>Checklist When Adding Any Component</strong></h1>
<p>Whenever you add a new plugin-like component, check these five things:</p>
<ol>
<li>unique <code>name</code></li>
<li>correct protocol methods implemented</li>
<li><code>register(...)</code> called</li>
<li>import path that triggers registration exists</li>
<li>config / CLI name matches the registered <code>name</code></li>
</ol>
<p>If one of these is missing, the component will not be discoverable.</p>
</section>

<h1 id="common-failure-modes"><strong>Common Failure Modes</strong></h1>
<p>Typical mistakes:</p>
<ul>
<li>forgot to call <code>register(...)</code></li>
<li>forgot to import the module for side effects</li>
<li>reused an existing <code>name</code></li>
<li>implemented the wrong return shape</li>
<li>config references the filename instead of the registered <code>name</code></li>
</ul>
<p>Those are exactly the kinds of issues the registry pattern makes easier to debug.</p>
</section>

<h1 id="takeaway"><strong>Takeaway</strong></h1>
<p>The repo is deep, but the architecture is consistent:</p>
<ul>
<li>configs describe experiments</li>
<li>entrypoints assemble them</li>
<li>loaders and wrappers build inputs/models</li>
<li>merge/rebase transform updates</li>
<li>eval reports outcomes</li>
</ul>
<p>That repeatable pattern is what makes the codebase navigable.</p>
</section>
