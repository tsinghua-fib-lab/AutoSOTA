suite: vision8
tasks: all
all_pairs: true

clip_model: ViT-B-32
clip_pretrained: openai
device: cuda
dtype: null

batch_size: 128
num_workers: 6
val_fraction: 0.1
seed: 42
eval_split: val

base_ckpt: null
strict_load: false
forward_mode: auto

text_features_source: auto
text_features_checkpoint: pair_task

alpha_min: 0.0
alpha_max: 1.0
alpha_step: 0.1

heatmap_alpha_min: 0.0
heatmap_alpha_max: 1.0
heatmap_alpha_step: 0.1

save_plots: true
output_dir: src/.cache/vision_connectivity/vision8_all_pairs

tuned_ckpts:
  Cars: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/Cars/peft_lora_last_ep.pt
  DTD: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/DTD/peft_lora_last_ep.pt
  EuroSAT: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/EuroSAT/peft_lora_last_ep.pt
  GTSRB: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/GTSRB/peft_lora_last_ep.pt
  MNIST: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/MNIST/peft_lora_last_ep.pt
  RESISC45: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/RESISC45/peft_lora_last_ep.pt
  SUN397: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/SUN397/peft_lora_last_ep.pt
  SVHN: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/SVHN/peft_lora_last_ep.pt
