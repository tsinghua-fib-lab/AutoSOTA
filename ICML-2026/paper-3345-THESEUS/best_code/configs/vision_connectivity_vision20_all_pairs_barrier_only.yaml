suite: vision20
tasks: all
all_pairs: true

clip_model: ViT-B-32
clip_pretrained: openai
device: cuda
dtype: null

batch_size: 128
num_workers: 6
val_fraction: 0.1
seed: 42
eval_split: val

base_ckpt: null
strict_load: false
forward_mode: auto

text_features_source: auto
text_features_checkpoint: pair_task

alpha_min: 0.0
alpha_max: 1.0
alpha_step: 0.1

# Barrier-only mode: skip 2D connectivity plane.
run_heatmap: false
heatmap_alpha_min: 0.0
heatmap_alpha_max: 1.0
heatmap_alpha_step: 0.1

save_plots: true
output_dir: src/.cache/vision_connectivity/vision20_all_pairs_barrier_only

tuned_ckpts:
  Cars: src/checkpoints/finetune_two_stage_coop/ViT-B-32/openai/Cars/full_last_ep.pt
