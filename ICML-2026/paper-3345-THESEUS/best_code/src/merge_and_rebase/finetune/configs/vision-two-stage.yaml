common:
  seed: 42
  deterministic: false

  device: cuda
  dtype: fp32

  backbone:
    name: openclip
    clip_model: ViT-B-32
    clip_pretrained: openai

  data:
    batch_size: 128
    num_workers: 6
    val_fraction: 0.1
    pin_memory: true

  train:
    epochs: null              # fallback if a dataset doesn't specify it
    optimizer:
      name: adamw
    lr: 1.0e-5
    weight_decay: 0.1
    accumulate_grad_batches: 1 # should be 128 / batch_size to simulate batch size of 128
    lr_scheduler:
      name: cosine              # cosine | linear | constant
    grad_clip_norm: 1.0
    early_stopping: false
    early_stopping_patience: 5

  strategy:
    name: full                # full | linear_probe | peft_lora
    forward_mode: standard    # standard | linearized_ntk
    params: {}
    text_embeddings_finetune:
      enabled: true
      epochs: 3
      optimizer: adamw
      lr: 1.0e-3
      weight_decay: 0.0
      warmup_length: 0
      grad_clip_norm: 1.0
      accumulate_grad_batches: 1
      early_stopping: false
      early_stopping_patience: 5

  output:
    out_dir: src/checkpoints/finetune_two_stage
    save_format: full         # full | head
    save_last_epoch: true

  logging:
    use_wandb: false
    project: null
    entity: null
    tags: []
    mode: online              # online | offline | disabled
    local_log_dir: null
    log_every_n_steps: 50
    run_name: null

# List of datasets you want to run, if you want the config to drive selection.
# You can still override via CLI --suite/--datasets.
datasets_order:
  - SUN397
  - Cars
  - RESISC45
  - EuroSAT
  - SVHN
  - GTSRB
