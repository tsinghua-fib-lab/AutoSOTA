common:
  seed: 42
  deterministic: false
  device: cuda
  dtype: fp32
  backbone:
    name: openclip
    clip_model: ViT-L-14
    clip_pretrained: openai
  data:
    batch_size: 4
    num_workers: 6
    val_fraction: 0.1
    pin_memory: true
    train_preprocess: train
  train:
    epochs: null
    optimizer:
      name: adamw
    lr: 0.0003
    weight_decay: 0.1
    accumulate_grad_batches: 32
    lr_scheduler:
      name: cosine
      warmup_steps: 500
    grad_clip_norm: -1.0
    early_stopping: false
    early_stopping_patience: 5
  strategy:
    name: full
    forward_mode: linearized_ntk
    forward_mode_params:
      linearized_feature_normalization: true
    params:
      parameterization: delta
      trainable_params: regularized_only
  regularization:
    name: kfac_ggn
    cache_dir: src/checkpoints/kfac_ggn
    precision: fp32
    reg_lambda: 100.0
    full_block_scaler: 10.0
    projection_scaler: 0.01
    cadence: 1
    force_recompute: false
    train_percent: 0.3
    fisher_seed: 42
    fisher_num_samples_expectation: 1
  output:
    out_dir: src/checkpoints/tak_kfac_20vision_ref
    save_format: full
    save_last_epoch: true
  logging:
    use_wandb: false
    project: null
    entity: null
    tags:
      - tak
      - kfac_ggn
      - vision20
      - 20vision-ref
      - vitl14
    mode: online
    local_log_dir: .log
    log_every_n_steps: 50
    run_name: null
datasets_order:
  - Cars
  - DTD
  - EuroSAT
