[project]
name = "step-decomposed-influence"
version = "0.1.1"
description = "Step-Decomposed Influence (SDI) and fast TracIn for (looped) transformers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "opacus>=1.5.0",
    "tqdm>=4.66.0",
    "opt-einsum>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdi"]
