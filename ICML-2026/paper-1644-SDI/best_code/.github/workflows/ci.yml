name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install
        run: uv venv && pip install -e ".[dev]"
      - name: Ruff format
        run: uv run ruff format
      - name: Ruff check (auto-fix)
        run: uv run ruff check --fix
      - name: Pyright
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
