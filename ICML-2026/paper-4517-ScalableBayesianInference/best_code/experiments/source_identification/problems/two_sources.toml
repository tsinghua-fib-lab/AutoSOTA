# Two-source problem
# PINN cannot handle this (assumes single Gaussian)
# GP-FVM can recover the full nonparametric source field

[physics]
vx = 1.0          # Advection velocity in x
vy = 0.0          # Advection velocity in y
D = 0.05          # Diffusion coefficient
domain = [0.0, 1.0, 0.0, 1.0]  # [x_min, x_max, y_min, y_max]
c_inflow = 0.0    # Dirichlet BC at left boundary

# Two sources at different locations
[[sources]]
x = 0.25
y = 0.3
strength = 4.0
width = 0.10

[[sources]]
x = 0.35
y = 0.7
strength = 3.0
width = 0.12

# Observations spread across the domain

[[observations]]
x = 0.5
y = 0.3

[[observations]]
x = 0.5
y = 0.7

[[observations]]
x = 0.6
y = 0.5

[[observations]]
x = 0.7
y = 0.3

[[observations]]
x = 0.7
y = 0.7

[[observations]]
x = 0.8
y = 0.4

[[observations]]
x = 0.8
y = 0.6

[[observations]]
x = 0.9
y = 0.5

[[observations]]
x = 0.4
y = 0.4

[[observations]]
x = 0.4
y = 0.6

[[observations]]
x = 0.5
y = 0.5

[[observations]]
x = 0.6
y = 0.3

[noise]
std = 0.01
seed = 42
