# Note: PyTorch Geometric extensions (torch-cluster, torch-scatter, torch-sparse, torch-spline-conv)
# are installed manually via: uv pip install torch-cluster torch-scatter torch-sparse torch-spline-conv -f https://data.pyg.org/whl/torch-2.8.0+cu128.html
# This is because they require specific wheel files that match the PyTorch version and CUDA version.

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true



[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

# Note: PyTorch Geometric extensions (torch-cluster, torch-scatter, torch-sparse, torch-spline-conv)
# need to be installed manually with specific wheel URLs:
# uv pip install torch-cluster torch-scatter torch-sparse torch-spline-conv -f https://data.pyg.org/whl/torch-2.8.0+cu128.html

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veclink"]
