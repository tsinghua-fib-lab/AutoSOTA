[project]
name = "veclink"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<3.14"
readme = "README.md"
dependencies = [
    "tqdm>=4.67.1,<5",
    "torch>=2.8.0",
    "beir>=2.0.0,<3",
    "pybind11>=2.13.6,<3",
    "fasttext>=0.9.3,<0.10",
    "openai>=1.57.0,<2",
    "einops>=0.8.0,<0.9",
    "transformers>=4.43.4,<4.45",
    "dvc>=3.42.0,<4",
    "dvc-s3>=3.2.0,<4",
    "numpy>=2.0",
    "gensim>=4.3.3,<5",
    "mistralai>=1.2.5,<2",
    "loguru>=0.7.2,<0.8",
    "flagembedding>=1.3.3,<2",
    "pip>=25.0.1,<26",
    "ipykernel>=6.29.5,<7",
    "umap-learn>=0.5.7,<0.6",
    "torchvision>=0.22.0",
    "networkx>=3.2.1,<4",
    "scikit-learn>=1.4.1,<2",
    "matplotlib>=3.7.0,<3.10.0",
    "optimal-transport>=0.0.1,<0.0.2",
    "pot>=0.9.5,<0.10",
    "google>=3.0.0,<4",
    "cohere>=5.15.0,<6",
    "google-generativeai>=0.8.5,<0.9",
    "mteb[gritlm]>=1.38.20,<2",
    "nltk>=3.9.1,<4",
    "google-genai>=1.16.1,<2",
    "kagglehub>=0.3.12",
    "kaggle>=1.7.4.5",
    "torch-geometric>=2.6.1",
    "clip>=0.2.0",
    "cupy-cuda12x>=13.5.1",
    "h5py>=3.14.0",
    "faiss-gpu-cu12>=1.14.0",
    "seaborn>=0.13.2",
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
