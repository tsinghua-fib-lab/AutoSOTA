[project]
name = "asymmetrically-perturbed-gda"
version = "0.1.0"
description = "Code for the ICML 2026 paper \"Asymmetric Perturbation in Solving Bilinear Saddle-Point Optimization\"."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kenshi Abe", email = "abe_kenshi@cyberagent.co.jp" },
    { name = "Mitsuki Sakamoto", email = "sakamoto_mitsuki@cyberagent.co.jp" },
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "cvxopt>=1.3.2",
    "fsspec>=2025.12.0",
    "hydra-core>=1.3.2",
    "liteefg>=0.1.3",
    "matplotlib>=3.10.9",
    "nashpy>=0.0.43",
    "open-spiel>=1.6.10",
    "pandas>=2.3.3",
    "timeout-decorator>=0.5.0",
    "tqdm>=4.67.1",
]

[tool.ruff]
lint.extend-ignore = ["E501", "S101", "S311", "UP035", "UP006", "E402", "S201", "S104", "F401", "C901"]
lint.select = [
    "W", # pycodestyle warnings
    "E", # pycodestyle errors
    "F", # pyflakes
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "I", # isort
    "C90", # mccabe complexity
    "N", # pep8-naming
    "UP", # pyupgrade
]
lint.fixable = ["ALL"]
line-length = 120

[dependency-groups]
notebook = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "jupyterlab-vim>=4.1.4",
    "python-ternary>=1.0.8",
]
