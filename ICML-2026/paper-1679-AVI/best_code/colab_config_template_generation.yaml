# Public example configuration for instruction-following/text-generation tasks.
# Replace placeholders with your own models, dataset, and output settings.

models:
  - name: "your-org/your-model-a"
    provider: "hf"
    max_new_tokens: 256
    temperature: 0.7
    top_p: 0.9
    use_chat_template: true

  - name: "your-org/your-model-b"
    provider: "hf"
    max_new_tokens: 256
    temperature: 0.7
    top_p: 0.9
    use_chat_template: true

questions: "hf:dataset_name:config:split:instruction_field"
question_shuffle: true
max_questions: 100

alpha: 0.1
max_t: 500
sampling_method: "random_pair"
top_k: null
max_tournament_samples: 200

judge:
  type: "openai"
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 5
  system_prompt: |
    You are an expert evaluator for instruction following and text generation.
    Compare two responses to the same instruction and output only "A" or "B".

huggingface:
  device_map: "auto"
  dtype: "float16"
  quantization: null
  trust_remote_code: false
  cache_dir: null
  low_cpu_mem_usage: true

output:
  dir: "example_results"
  save_interactions: true
  save_csv: true
  save_serpant_trace: true
  save_config_snapshot: true
  log_level: "INFO"

performance:
  batch_size: 1
  num_workers: 0
  prefetch_factor: null
  pin_memory: false

monitoring:
  enable: false
  log_memory_usage: false
  log_gpu_utilization: false
  checkpoint_interval: 100
  resume_from_checkpoint: false
