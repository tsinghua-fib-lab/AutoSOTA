models:
  - name: "openai-community/gpt2"
    provider: "hf"
    max_new_tokens: 64
    temperature: 0.7
    top_p: 0.9
    use_chat_template: false

  - name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    provider: "hf"
    max_new_tokens: 64
    temperature: 0.7
    top_p: 0.9
    use_chat_template: true

questions:
  - "What is machine learning?"
  - "Explain quantum computing in one sentence."
  - "What is the capital of France?"
  - "How does gravity work?"
  - "What is DNA?"

alpha: 0.1
max_t: 10
sampling_method: "random_pair"
top_k: null
max_tournament_samples: 10

judge:
  type: "openai"
  model: "deepseek-chat"
  temperature: 0.0
  max_tokens: 5
  base_url: "https://api.deepseek.com"
  api_key: ""  # Set DEEPSEEK_API_KEY or OPENAI_API_KEY env var instead
  system_prompt: |
    You are an expert evaluator. Compare two responses and output only "A" or "B".

huggingface:
  device_map: "auto"
  dtype: "float16"
  quantization: null
  trust_remote_code: false
  cache_dir: "/models/hf_cache"
  low_cpu_mem_usage: true

output:
  dir: "reproduction_results/quick_test"
  save_interactions: true
  save_csv: true
  save_serpant_trace: true
  save_config_snapshot: true
  log_level: "INFO"

performance:
  batch_size: 1
  num_workers: 0
