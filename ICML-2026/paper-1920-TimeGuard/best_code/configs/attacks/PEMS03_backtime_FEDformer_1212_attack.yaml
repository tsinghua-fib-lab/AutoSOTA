Train:
    is_clean_train: False
    is_attacker_trained: False # load the attacker if that already trained
    batch_size: 64
    learning_rate: 0.0001
    num_train_epochs: 100
    attack_lr: 0.005
    warmup: 10
    surrogate_name: FEDformer # FEDformer, TimesNet, Autoformer,
    dataset: PEMS03 # Weather, ETTm1, PEMS03
    pattern_type: cone
    trigger_len: 4
    pattern_len: 7
    bef_tgr_len: 6 
    lam_norm: 0.05
    alpha_s: 0.3  # spatial_poison_rate
    alpha_t: 0.03  # temporal_poison_rate
    epsilon: 0.2
    hidden_dim: 64  # hidden_dim for the trigger generator
    token_len: 12
    seq_len: 12
    pred_len: 12
    label_len: 0