# Fine-tuning model config matching baseline + modifications
scaleformer:
  mode: "predict"

  context_length: 512
  prediction_length: 128
  distribution_output: null
  loss: "mse"
  huber_delta: 1.0

  patch_length: 8
  patch_stride: 8
  num_hidden_layers: 8
  d_model: 48
  num_attention_heads: 8
  channel_attention: true
  ffn_dim: 512

  norm_type: "rmsnorm"
  norm_eps: 1e-05
  attention_dropout: 0.0
  positional_dropout: 0.0
  path_dropout: 0.0
  ff_dropout: 0.0
  bias: true
  activation_function: "gelu"
  pre_norm: true
  use_cls_token: false
  init_std: 0.02
  scaling: "std"
  do_mask_input: null
  mask_type: "random"
  random_mask_ratio: 0.5
  num_forecast_mask_patches: 3
  channel_consistent_masking: false
  unmasked_channel_indices: null
  mask_value: 0
  pooling_type: "mean"
  head_dropout: 0.0
  num_parallel_samples: 100

  use_prompt_network: true

  channel_rope: false
  max_wavelength: 500
  rope_percent: 0.75

  pretrained_encoder_path: null
  pretrained_pft_path: "./checkpoints/Nexus1.0-base/checkpoint-final"

  use_dynamics_embedding: true
  num_poly_feats: 8
  poly_degrees: 2
  rff_trainable: true
  rff_scale: 1.0
  num_rff: 24

  n_routed_experts: 0
  num_experts_per_tok: 2
  moe_intermediate_size: 1024
  n_shared_experts: 1
  aux_loss_alpha: 0.0
  norm_topk_prob: true
