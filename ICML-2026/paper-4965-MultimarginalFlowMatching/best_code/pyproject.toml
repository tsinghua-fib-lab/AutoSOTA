[project]
name = "otpfm"
dynamic = ["version"]
description = "OTP-FM: Multimarginal flow matching with optimal transport potentials"
authors = [{name = "Raghav Kansal", email = "raghav.kansal@bexorg.com"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["flow matching", "optimal transport", "deep learning", "generative models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
w2 = ["pot>=0.9"]             # For W2Potential
all = ["otpfm[w2]"]           # All optional core deps
experiments = [
    "otpfm[all]",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.0",
    "pillow>=10.0",           # For animations
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-parser>=2",
    "myst-nb>=1",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-bibtex>=2",
]

[project.urls]
Homepage = "https://github.com/Bexorg-Inc/OTP-FM"
Documentation = "https://otp-fm.readthedocs.io"
Repository = "https://github.com/Bexorg-Inc/OTP-FM"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/otpfm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/otpfm", "experiments"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # Line too long
    "E741",  # Ambiguous variable name (math notation)
    "F841",  # Local variable never used (intentional in some cases)
    "B007",  # Loop control variable not used (intentional in some cases)
    "B027",  # Empty ABC method without abstractmethod
    "B904",  # Raise from err
    "B905",  # zip without strict
    "W291",  # Trailing whitespace
    "W293",  # Blank line with whitespace
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pixi configuration for development
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
docs-html = "sphinx-build -b html docs docs/_build/html"
docs-clean = { cmd = "rm -rf docs/_build", description = "Remove built Sphinx docs" }

[tool.pixi.pypi-dependencies]
otpfm = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.dependencies]
pytorch = ">=2.0"
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.7,<4"
pot = ">=0.9.6.post1,<0.10"
pytest = ">=9.0.2,<10"
scikit-learn = ">=1.0"
pandas = ">=2.0"
scipy = ">=1.10"
tqdm = ">=4.0"
black = ">=24.0"
ruff = ">=0.4"
pre-commit = ">=3.0"
