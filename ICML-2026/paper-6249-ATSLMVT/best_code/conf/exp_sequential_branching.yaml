# @package _global_
defaults:
  - /trajectory: oscillatory_sequential_branching
  - /transport: pot
  - /surrogate: linearized_gp
  - /oracle: trajectory_sample
  - /reference: barycenter
  - /baseline@baselines.random: random
  - /baseline@baselines.uniform: uniform
  - /strategy@strategies.active_w2_matern5_2_variance: active_w2_fit_reference_matern5_2_variance
  - /strategy@strategies.active_no_warp_matern5_2_variance: active_no_warp_fit_reference_matern5_2_variance
  - /strategy@strategies.active_w2_rbf_variance: active_w2_fit_reference_rbf_variance
  - /strategy@strategies.uniform_w2_matern5_2: uniform_w2_fit_reference_matern5_2
  - /strategy@strategies.random_w2_matern5_2: random_w2_fit_reference_matern5_2
  - override /kernel@surrogate.kernel_spec: matern5_2
  - _self_

seed: 0
num_steps: 11
initial_times: [0.0]
sample_size: 512

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: INFO

active_loop:
  recompute_reference_as_barycenter: true
  barycenter_size: ${reference.barycenter_size}
  barycenter_num_iter: ${reference.num_iter}

reference:
  barycenter_size: 512
  num_iter: 10

transport:
  n_support: 512
  max_iter: 100000

surrogate:
  basis_rank: 10
  prior_variance: 1.0
  base_variance: 0.05
  kernel_spec:
    lengthscale: 0.4
  regressor_kwargs:
    training_iter: 50
    lr: 0.05
    jitter: 1e-5
    input_scaling: true
    output_scaling: true
    init_lengthscale_median: true
    init_outputscale_from_data: true
    noise_prior_from_data_scale: 0.1
    noise_initializer:
      _target_: active_wasserstein.inference.variance_scaled_noise_initializer
      scale: 0.001

evaluation:
  # Explicit evaluation times (takes precedence if provided)
  times: null
  num_eval: 100
  t_start: null
  t_end: null
  sample_size: ${sample_size}
  n_support: 512
  sample_method: sample_persistent
  velocity_source: trajectory
  velocity_sample_noisy: false
  save_checkpoint_state: false
  checkpoints: [1, 3, 5, 7, 9, 11]

common_reference:
  enabled: true
  source: eval_barycenter
  times: null
  barycenter_size: ${reference.barycenter_size}
  num_iter: ${reference.num_iter}
  sample_method: ${evaluation.sample_method}
  sample_size: ${evaluation.sample_size}
  fixed: null

oracle:
  sample_method: sample_persistent
  sample_size: ${sample_size}

candidate_pool:
  num_candidates: 50
  times: null
  t_start: null
  t_end: null

uniform_schedule:
  num_steps: ${num_steps}
  exclude_initial: true
  t_start: null
  t_end: null

strategy_order:
  - active_w2_matern5_2_variance
  - uniform_w2_matern5_2
  - random_w2_matern5_2

strategy_overrides: {}

hydra:
  run:
    dir: ${oc.env:OUTPUT_ROOT,results}/${oc.env:EXPERIMENT_NAME,${hydra:job.name}}/${now:%Y-%m-%d}/${now:%H-%M-%S}
