[project]
name = "active-wasserstein"
version = "0.1.0"
description = "Active Timepoint Selection for Learning Measure-Valued Trajectories (ICML 2026)"
readme = "README.md"
authors = [
    { name = "Nicolas Huynh" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
    "torch>=2.3,<3",
    "gpytorch>=1.11",
    "botorch>=0.10.0",
    "pot>=0.9",
    "hydra-core>=1.3",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "anndata>=0.12.6",
    "scanpy>=1.11.5",
    "igraph>=1.0.0",
    "cellrank>=2.0.7",
    "xarray",
    "netcdf4",
    "pydap",
    "cloudpickle>=3.0",
    "pytorch-lightning>=2.6.1",
    "scienceplots>=2.2.1",
]

[project.scripts]
active-wasserstein = "active_wasserstein:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
