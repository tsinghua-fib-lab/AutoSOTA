name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Node.js 20 is deprecated on GitHub runners (forced to Node 24 from 2026-06-16);
# opt the JS actions into Node 24 now.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU torch first (the default Linux wheel is the multi-GB CUDA build), then
      # the package + pytest. transformers is a core dep, so the compat / Conv1D /
      # Mixtral tests run; the TOFU tests are gated off and skip.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests (CPU-only; TOFU gated off)
        run: pytest -q tests/ -rs
